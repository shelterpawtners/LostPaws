name: Persona QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: persona-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_persona: ${{ steps.gate.outputs.run_persona }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/classify-change-impact.sh "$BASE_SHA" "$HEAD_SHA"
      - id: gate
        name: Run browser personas only at acceptance
        env:
          REQUIRED: ${{ steps.impact.outputs.requires_persona_qa }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run_persona=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(sed -n 's/^STATUS:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          safe=$(sed -n 's/^SAFE_TO_CONTINUE:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          owner=$(sed -n 's/^OWNER_DECISION_REQUIRED:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          if [[ "$REQUIRED" == "true" && "$status" == "READY_FOR_ACCEPTANCE" && "$safe" == "YES" && "$owner" == "NO" ]]; then
            echo "run_persona=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_persona=false" >> "$GITHUB_OUTPUT"
          fi

  persona:
    needs: gate
    if: needs.gate.outputs.run_persona == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable local-only Admin QA Edge Functions
        shell: bash
        run: |
          mkdir -p supabase/functions
          printf 'QA_MODE_ENABLED=true\n' > supabase/functions/.env
      - name: Start local Supabase
        run: bash scripts/supabase-cli.sh start
      - name: Reset and seed local database
        run: bash scripts/supabase-cli.sh db reset
      - name: Export local Supabase browser settings
        shell: bash
        run: |
          bash scripts/supabase-cli.sh status -o env > supabase.env
          set -a
          source supabase.env
          set +a
          echo "PLAYWRIGHT_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          if [[ -n "${ANON_KEY:-}" ]]; then
            echo "PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          elif [[ -n "${PUBLISHABLE_KEY:-}" ]]; then
            echo "PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
          else
            exit 1
          fi
      - name: Install Chromium
        run: bash scripts/install-playwright-chromium.sh
      - name: Run persona registration, auth recovery, access, Passport, media, Deal Moment, and redemption tests
        run: npx playwright test e2e/guardian-dashboard.spec.ts e2e/persona-registration.spec.ts e2e/auth-recovery.spec.ts e2e/persona-access-isolation.spec.ts e2e/phase-1-auth.spec.ts e2e/phase-3-guardian-passport.spec.ts e2e/guardian-pet-media.spec.ts e2e/guardian-deal-moments.spec.ts e2e/phase-2-offer-redemption.spec.ts e2e/events.spec.ts
      - name: Run local Admin QA security regression
        env:
          VITE_ADMIN_QA_MODE_ENABLED: "true"
          PLAYWRIGHT_HOSTED_QA: "true"
          PLAYWRIGHT_ADMIN_EMAIL: platform-admin@example.invalid
          PLAYWRIGHT_ADMIN_PASSWORD: Demo-only-Platform!
          PLAYWRIGHT_GUARDIAN_EMAIL: guardian-a@example.invalid
          PLAYWRIGHT_GUARDIAN_PASSWORD: Demo-only-Guardian-A!
        run: npm run test:e2e:admin-qa
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: persona-playwright-results
          path: test-results/
          if-no-files-found: ignore

  persona-gate:
    name: Persona QA Gate
    if: always()
    needs: [gate, persona]
    runs-on: ubuntu-latest
    steps:
      - name: Require full Persona QA only when gated on
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          REQUIRED: ${{ needs.gate.outputs.run_persona }}
          PERSONA_RESULT: ${{ needs.persona.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GATE_RESULT" == "success" ]] || exit 1
          if [[ "$REQUIRED" == "true" && "$PERSONA_RESULT" != "success" ]]; then
            exit 1
          fi
          echo "Persona QA requirement satisfied."
