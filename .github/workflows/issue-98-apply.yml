name: Issue 98 apply Facebook frontend patch

on:
  push:
    branches:
      - fix/issue-98-facebook-frontend

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-98-facebook-frontend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused source patch
        run: python scripts/issue98_integrate.py
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: npx prettier --write src/main.tsx e2e/social-auth-ui.spec.ts
      - name: Check source
        run: npm run check
      - name: Build app
        run: npm run build
      - name: Commit integrated source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx e2e/social-auth-ui.spec.ts
          git commit -m "Issue #98: wire Facebook social auth frontend"
          git push origin HEAD:fix/issue-98-facebook-frontend
