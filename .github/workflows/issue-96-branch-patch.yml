name: Issue 96 branch patch

on:
  push:
    branches:
      - fix/issue-96-canonical-lostpaws

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue96-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-96-canonical-lostpaws
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused canonical route patch
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/main.tsx')
          text = main.read_text()

          import_anchor = 'import { AdoptionVerificationResponder } from "./components/AdoptionVerificationResponder";\n'
          import_line = 'import { LostPawsCampaign } from "./components/LostPawsCampaign";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('LostPaws import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_route = '      <Route path="/lostpaws" element={<FoundationPage name="lostpaws" />} />'
          new_route = '''      <Route
            path="/lostpaws"
            element={
              <Page>
                <LostPawsCampaign />
              </Page>
            }
          />'''
          if old_route in text:
              text = text.replace(old_route, new_route, 1)
          elif '<LostPawsCampaign />' not in text:
              raise SystemExit('LostPaws route anchor not found')

          main.write_text(text)

          vercel = Path('vercel.json')
          v = vercel.read_text()
          v = v.replace('    { "source": "/lostpaws", "destination": "/lostpaws.html" },\n', '')
          v = v.replace('    { "source": "/lostpaws/", "destination": "/lostpaws.html" },\n', '')
          vercel.write_text(v)

          legacy = Path('public/lostpaws.html')
          if legacy.exists():
              legacy.unlink()

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Commit verified branch patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.tsx vercel.json public/lostpaws.html
          git commit -m 'Issue #96: wire canonical LostPaws route [issue96-patched]'
          git push origin HEAD:fix/issue-96-canonical-lostpaws
