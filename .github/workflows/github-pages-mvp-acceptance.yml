name: GitHub Pages MVP Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/github-pages-mvp-acceptance.yml"
      - ".github/workflows/github-pages-staging.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_run:
    workflows: ["GitHub Pages Staging"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-mvp-acceptance-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  public-release-matrix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.QA_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GOOGLE_AUTH_ENABLED: "true"
      VITE_FACEBOOK_AUTH_ENABLED: "false"
      VITE_ADMIN_QA_MODE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start pull-request release candidate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VITE_SUPABASE_URL}" || -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo 'ERROR: MVP acceptance requires the existing QA Supabase publishable configuration.' >&2
            exit 1
          fi
          npm run build
          nohup npm exec -- vite preview --host 127.0.0.1 --port 4173 >/tmp/pages-mvp-preview.log 2>&1 &
          echo $! >/tmp/pages-mvp-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo 'SITE_URL=http://127.0.0.1:4173' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pages-mvp-preview.log >&2 || true
          echo 'ERROR: Local release candidate did not become ready.' >&2
          exit 1

      - name: Use deployed Pages release candidate
        if: github.event_name != 'pull_request'
        run: echo 'SITE_URL=https://shelterpawtners.github.io/LostPaws' >> "$GITHUB_ENV"

      - name: Exercise MVP release candidate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 },
          ];
          const appRoutes = [
            '/',
            '/lostpaws',
            '/rave',
            '/rave-shelter',
            '/passport',
            '/marketplace',
            '/register',
            '/login',
            '/forgot-password',
            '/reset-password',
          ];

          for (const viewport of viewports) {
            const page = await browser.newPage({ viewport });
            for (const route of appRoutes) {
              console.log(`Checking ${viewport.name} ${route}`);
              const pageErrors = [];
              const failedResponses = [];
              const onPageError = error => pageErrors.push(error.message);
              const onResponse = response => {
                if (response.status() >= 500) {
                  failedResponses.push(`${response.status()} ${response.url()}`);
                }
              };
              page.on('pageerror', onPageError);
              page.on('response', onResponse);

              const response = await page.goto(`${process.env.SITE_URL}${route}`, {
                waitUntil: 'networkidle',
              });
              if (!response || response.status() >= 500) {
                throw new Error(`${viewport.name} ${route}: navigation failed with ${response?.status()}`);
              }
              await page.locator('#main').waitFor({ state: 'visible', timeout: 15000 });
              try {
                await page.locator('h1, h2').filter({ visible: true }).first().waitFor({ state: 'visible', timeout: 30000 });
              } catch (error) {
                const bodyText = (await page.locator('body').innerText()).slice(0, 1200);
                throw new Error(`${viewport.name} ${route}: no visible primary heading. Body excerpt:\n${bodyText}\n${error}`);
              }

              const hasHorizontalOverflow = await page.evaluate(
                () => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
              );
              if (hasHorizontalOverflow) {
                throw new Error(`${viewport.name} ${route}: horizontal viewport overflow detected`);
              }
              if (pageErrors.length) {
                throw new Error(`${viewport.name} ${route}: page errors:\n${pageErrors.join('\n')}`);
              }
              if (failedResponses.length) {
                throw new Error(`${viewport.name} ${route}: 5xx responses:\n${failedResponses.join('\n')}`);
              }

              page.off('pageerror', onPageError);
              page.off('response', onResponse);
            }

            await page.goto(`${process.env.SITE_URL}/`, { waitUntil: 'networkidle' });
            const homeMissionLink = page.getByRole('link', { name: /See the RAVE Shelter mission/ });
            await homeMissionLink.waitFor({ state: 'visible', timeout: 10000 });
            await homeMissionLink.click();
            await page.waitForURL(url => url.pathname.endsWith('/rave'), { timeout: 10000 });
            await page.getByRole('heading', { name: /Music\. Community\. Shelter pets\./i }).waitFor({ state: 'visible', timeout: 10000 });

            for (const route of ['/rave', '/lostpaws']) {
              await page.goto(`${process.env.SITE_URL}${route}`, { waitUntil: 'networkidle' });
              await page.getByRole('heading', { name: /Music\. Community\. Shelter pets\./i }).waitFor({ state: 'visible', timeout: 10000 });
              const expectedLinks = [
                ['Shop RAVE Shelter offers', '/marketplace?channel=rave'],
                ['Join as a vendor', '/register?type=rave_vendor'],
                ['Create a Guardian account', '/register?type=guardian'],
                ['Register a shelter', '/register?type=shelter'],
              ];
              for (const [name, suffix] of expectedLinks) {
                const href = await page.getByRole('link', { name, exact: true }).first().getAttribute('href');
                if (!href || !href.endsWith(suffix)) {
                  throw new Error(`${viewport.name} ${route}: ${name} points to ${href}, expected suffix ${suffix}`);
                }
              }
            }

            await page.goto(`${process.env.SITE_URL}/rave-shelter`, { waitUntil: 'networkidle' });
            await page.waitForURL(url => url.pathname.endsWith('/rave'), { timeout: 10000 });

            await page.goto(`${process.env.SITE_URL}/marketplace`, { waitUntil: 'networkidle' });
            await page.locator('[data-marketplace-concept="flagship"]').waitFor({ state: 'visible', timeout: 30000 });
            await page.locator('.offerCard').first().waitFor({ state: 'visible', timeout: 30000 });
            await page.close();
          }

          if (process.env.SITE_URL.includes('github.io')) {
            const campaign = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const vendorResponse = await campaign.goto(`${process.env.SITE_URL}/rave-vendors.html`, {
              waitUntil: 'networkidle',
            });
            if (!vendorResponse || !vendorResponse.ok()) {
              throw new Error(`RAVE vendor campaign page failed with ${vendorResponse?.status()}`);
            }
            const vendorBody = await campaign.locator('body').innerText();
            if (!vendorBody.includes('Join the RAVE Shelter vendor network.')) {
              throw new Error('RAVE vendor acquisition content did not render.');
            }
            const vendorOverflow = await campaign.evaluate(
              () => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
            );
            if (vendorOverflow) throw new Error('RAVE vendor page overflows the mobile viewport.');
            await campaign.close();
          }

          console.log('MVP release matrix passed on mobile, tablet, and desktop.');
          await browser.close();
          EOF

      - name: Stop pull-request release candidate
        if: always() && github.event_name == 'pull_request'
        run: |
          if [[ -f /tmp/pages-mvp-preview.pid ]]; then
            kill "$(cat /tmp/pages-mvp-preview.pid)" || true
          fi

  authenticated-guardian-smoke:
    name: Authenticated Guardian live smoke
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://shelterpawtners.github.io/LostPaws
      QA_GUARDIAN_EMAIL: ${{ secrets.QA_GUARDIAN_EMAIL }}
      QA_GUARDIAN_PASSWORD: ${{ secrets.QA_GUARDIAN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Require Guardian QA credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${QA_GUARDIAN_EMAIL}" ]] || { echo 'Missing QA_GUARDIAN_EMAIL secret.' >&2; exit 1; }
          [[ -n "${QA_GUARDIAN_PASSWORD}" ]] || { echo 'Missing QA_GUARDIAN_PASSWORD secret.' >&2; exit 1; }

      - name: Verify signed-in Guardian shell without mutating data
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'desktop', width: 1440, height: 1000 },
          ];

          for (const viewport of viewports) {
            console.log(`Checking authenticated Guardian shell on ${viewport.name}`);
            const context = await browser.newContext({ viewport });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));

            await page.goto(`${process.env.SITE_URL}/login`, { waitUntil: 'networkidle' });
            await page.getByLabel('Email address').fill(process.env.QA_GUARDIAN_EMAIL);
            await page.getByLabel('Password').fill(process.env.QA_GUARDIAN_PASSWORD);
            await page.getByRole('button', { name: 'Sign in' }).click();
            await page.waitForURL(/\/LostPaws\/dashboard$/, { timeout: 20000 });
            await page.locator('#main').waitFor({ state: 'visible', timeout: 15000 });

            if (viewport.name === 'mobile') {
              await page.getByRole('button', { name: 'Open menu' }).click();
            }
            const accountMenu = page.locator('.guardianAccountMenu');
            await accountMenu.locator('summary').click();
            const helpButton = accountMenu.getByRole('button', { name: 'Help & feedback' });
            await helpButton.waitFor({ state: 'visible', timeout: 10000 });
            await helpButton.click();
            await accountMenu.getByRole('heading', { name: 'Help & feedback' }).waitFor({ state: 'visible', timeout: 10000 });
            await accountMenu.getByRole('button', { name: 'Close help form' }).click();

            await page.goto(`${process.env.SITE_URL}/passport`, { waitUntil: 'networkidle' });
            if (!page.url().includes('/LostPaws/passport')) {
              throw new Error(`${viewport.name}: Guardian Passport navigation did not remain on the protected route.`);
            }

            if (viewport.name === 'mobile') {
              await page.getByRole('button', { name: 'Open menu' }).click();
            }
            await page.getByRole('button', { name: 'Sign out' }).click();
            await page.waitForURL(/\/LostPaws\/?$/, { timeout: 15000 });
            await page.goto(`${process.env.SITE_URL}/dashboard`, { waitUntil: 'networkidle' });
            await page.waitForURL(/\/LostPaws\/login$/, { timeout: 15000 });

            if (pageErrors.length) {
              throw new Error(`${viewport.name}: page errors:\n${pageErrors.join('\n')}`);
            }
            await context.close();
          }

          console.log('Authenticated Guardian live smoke passed without creating or changing application data.');
          await browser.close();
          EOF
