name: Dev Loop Format Once

on:
  pull_request:
    branches: [build/festival-mvp]
    paths:
      - ".github/workflows/devloop-format-once.yml"

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'ops/dev-loop-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format bootstrap files
        run: npx prettier --write docs/AI-COST-AND-TESTING-GOVERNANCE.md docs/CURRENT-WORK.md CLAUDE.md .github/workflows/ai-ops-status.yml
      - name: Upload exact formatted files
        uses: actions/upload-artifact@v6
        with:
          name: devloop-formatted-files
          path: |
            docs/AI-COST-AND-TESTING-GOVERNANCE.md
            docs/CURRENT-WORK.md
            CLAUDE.md
            .github/workflows/ai-ops-status.yml
          if-no-files-found: error
