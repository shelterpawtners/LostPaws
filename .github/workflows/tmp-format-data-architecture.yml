name: Temporary Data Architecture Formatter

on:
  push:
    branches:
      - data-architecture/pet-media-guardian-feed

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: data-architecture/pet-media-guardian-feed
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format supported files
        run: npx prettier --write src/components/GuardianActivityTimeline.tsx src/components/GuardianProfileLite.tsx src/components/PetMediaGallery.tsx e2e/phase-2-offer-redemption.spec.ts e2e/guardian-pet-media.spec.ts docs/AI-HANDOFF.md .github/workflows/tmp-format-data-architecture.yml
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-format-data-architecture.yml
      - name: Commit formatting
        run: |
          git config user.name "Shelter Pawtners"
          git config user.email "shelterpawtners@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format data architecture slice"
          git push origin HEAD:data-architecture/pet-media-guardian-feed
