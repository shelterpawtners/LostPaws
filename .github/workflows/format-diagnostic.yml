name: Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier patch
        run: |
          npx prettier --write src docs README.md AGENTS.md CLAUDE.md '.github/**/*.{md,yml,yaml}'
          git diff -- src docs README.md AGENTS.md CLAUDE.md .github
