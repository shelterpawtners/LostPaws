name: Temporary Issue 125 Prettier

on:
  push:
    branches:
      - fix/issue-125-rave-lostpaws-mobile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/issue-125-rave-lostpaws-mobile
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format only Issue 125 files
        run: npx prettier --write src/components/LostPawsActivation.css src/components/LostPawsActivation.tsx
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/components/LostPawsActivation.css src/components/LostPawsActivation.tsx; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/LostPawsActivation.css src/components/LostPawsActivation.tsx
          git commit -m "Format Issue #125 launch surfaces"
          git push origin HEAD:fix/issue-125-rave-lostpaws-mobile
