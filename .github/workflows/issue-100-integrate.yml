name: Issue 100 verified integration

on:
  push:
    branches:
      - ux/issue-100-unified-rave-mission

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux/issue-100-unified-rave-mission
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused integration
        run: python scripts/issue-100-integrate.py

      - name: Format focused changes
        run: npx prettier --write src/main.tsx src/components/RaveShelterMission.tsx src/components/RaveShelterMission.css .github/workflows/github-pages-mvp-acceptance.yml

      - name: Validate source
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Issue #100 integration is already applied and verified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/components/RaveShelterMission.tsx src/components/RaveShelterMission.css .github/workflows/github-pages-mvp-acceptance.yml
          git commit -m "Issue #100: integrate unified RAVE Shelter mission flow"
          git push origin HEAD:ux/issue-100-unified-rave-mission
