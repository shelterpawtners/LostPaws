name: Issue 100 verified integration

on:
  push:
    branches:
      - ux/issue-100-unified-rave-mission

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux/issue-100-unified-rave-mission
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused Issue 100 integration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path("src/main.tsx")
          text = path.read_text()

          import_anchor = 'import { AdoptionVerificationResponder } from "./components/AdoptionVerificationResponder";\n'
          mission_import = 'import { RaveShelterMission } from "./components/RaveShelterMission";\n'
          if mission_import not in text:
              if import_anchor not in text:
                  raise SystemExit("Issue #100 import anchor not found")
              text = text.replace(import_anchor, import_anchor + mission_import, 1)

          new_home = '''      <section className="lostPawsFeature">
        <div className="shell lostPawsFeatureCard">
          <div>
            <span className="eyebrow">LostPaws × RAVE Shelter</span>
            <h2>Music. Community. More resources for shelter pets.</h2>
            <p className="lead">
              LostPaws is the music-community activation of RAVE Shelter — the
              Rescue and Adoption Vendor Ecosystem. Shop participating partners,
              save on useful products and merch, and help turn everyday spending
              into more support for shelter pets.
            </p>
            <div className="actions">
              <Link className="btn" to="/rave">
                See the RAVE Shelter mission <ArrowRight />
              </Link>
              <Link className="btn quiet" to="/marketplace?channel=rave">
                Browse RAVE offers
              </Link>
            </div>
            <small>
              Independent community initiative. No festival affiliation or
              endorsement is implied.
            </small>
          </div>
          <aside className="lostPawsRoadmap" aria-label="How RAVE Shelter works">
            <Music2 />
            <span className="eyebrow">The simple idea</span>
            <h3>Shop. Save. Help shelter pets.</h3>
            <p>
              Participating partners create useful value for the community while
              supporting the shelter mission. Our giving roadmap also lets
              Guardians pass eligible savings forward as those tools come online.
            </p>
            <Link to="/register?type=rave_vendor">
              Vendors: join RAVE Shelter <ArrowRight />
            </Link>
          </aside>
        </div>
      </section>
'''
          home_pattern = re.compile(
              r'      <section className="lostPawsFeature">.*?      </section>\n(?=      <section className="section shell">)',
              re.S,
          )
          if "See the RAVE Shelter mission" not in text:
              text, count = home_pattern.subn(new_home, text, count=1)
              if count != 1:
                  raise SystemExit("Issue #100 home feature anchor not found")

          new_rave = '''function RaveMissionPage() {
  return (
    <Page>
      <RaveShelterMission />
    </Page>
  );
}
'''
          rave_pattern = re.compile(r'function Rave\(\) \{.*?\n\}\n(?=function Register\(\))', re.S)
          if "function RaveMissionPage()" not in text:
              text, count = rave_pattern.subn(new_rave, text, count=1)
              if count != 1:
                  raise SystemExit("Issue #100 RAVE page anchor not found")

          lostpaws_foundation = '''  lostpaws: {
    eyebrow: "LostPaws",
    title: "Music community energy for shelter pets.",
    copy: "An independent community activation connecting ravers and vendors with ShelterPawtners’ adoption mission.",
  },
'''
          text = text.replace(lostpaws_foundation, "", 1)

          replacements = {
              '<Route path="/rave" element={<Rave />} />': '<Route path="/rave" element={<RaveMissionPage />} />',
              '<Route path="/rave-shelter" element={<Rave />} />': '<Route path="/rave-shelter" element={<Navigate to="/rave" replace />} />',
              '<Route path="/lostpaws" element={<FoundationPage name="lostpaws" />} />': '<Route path="/lostpaws" element={<RaveMissionPage />} />',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"Issue #100 route anchor not found: {old}")

          path.write_text(text)

          acceptance = Path(".github/workflows/github-pages-mvp-acceptance.yml")
          qa = acceptance.read_text()
          if '            "/rave",\n' not in qa:
              qa = qa.replace(
                  '            "/lostpaws",\n',
                  '            "/lostpaws",\n            "/rave",\n            "/rave-shelter",\n',
                  1,
              )

          anchor = '''            await page.goto(`${process.env.SITE_URL}/marketplace`, { waitUntil: 'networkidle' });
'''
          mission_checks = '''            await page.goto(`${process.env.SITE_URL}/`, { waitUntil: 'networkidle' });
            const homeMissionLink = page.getByRole('link', { name: /See the RAVE Shelter mission/ });
            await homeMissionLink.waitFor({ state: 'visible', timeout: 10000 });
            await homeMissionLink.click();
            await page.waitForURL(url => url.pathname.endsWith('/rave'), { timeout: 10000 });
            await page.getByRole('heading', { name: /Music\. Community\. Shelter pets\./i }).waitFor({ state: 'visible', timeout: 10000 });

            for (const route of ['/rave', '/lostpaws']) {
              await page.goto(`${process.env.SITE_URL}${route}`, { waitUntil: 'networkidle' });
              await page.getByRole('heading', { name: /Music\. Community\. Shelter pets\./i }).waitFor({ state: 'visible', timeout: 10000 });
              const expectedLinks = [
                ['Shop RAVE Shelter offers', '/marketplace?channel=rave'],
                ['Join as a vendor', '/register?type=rave_vendor'],
                ['Create a Guardian account', '/register?type=guardian'],
                ['Register a shelter', '/register?type=shelter'],
              ];
              for (const [name, suffix] of expectedLinks) {
                const href = await page.getByRole('link', { name, exact: true }).first().getAttribute('href');
                if (!href || !href.endsWith(suffix)) {
                  throw new Error(`${viewport.name} ${route}: ${name} points to ${href}, expected suffix ${suffix}`);
                }
              }
            }

            await page.goto(`${process.env.SITE_URL}/rave-shelter`, { waitUntil: 'networkidle' });
            await page.waitForURL(url => url.pathname.endsWith('/rave'), { timeout: 10000 });

'''
          if "homeMissionLink" not in qa:
              if anchor not in qa:
                  raise SystemExit("Issue #100 Pages acceptance anchor not found")
              qa = qa.replace(anchor, mission_checks + anchor, 1)
          acceptance.write_text(qa)
          PY

      - name: Format focused changes
        run: >-
          npx prettier --write src/main.tsx src/components/RaveShelterMission.tsx
          src/components/RaveShelterMission.css
          .github/workflows/github-pages-mvp-acceptance.yml
          .github/workflows/issue-100-integrate.yml

      - name: Validate source
        run: npm run check

      - name: Build application
        run: npm run build

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Issue #100 integration is already applied and verified."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/components/RaveShelterMission.tsx src/components/RaveShelterMission.css .github/workflows/github-pages-mvp-acceptance.yml .github/workflows/issue-100-integrate.yml
          git commit -m "Issue #100: integrate unified RAVE Shelter mission flow"
          git push origin HEAD:ux/issue-100-unified-rave-mission
