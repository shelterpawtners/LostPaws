name: Phase 3 CP1 Wire

on:
  push:
    branches:
      - phase3/guardian-passport-foundation

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase3/guardian-passport-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire Guardian components
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          text = path.read_text()

          import_marker = 'import { RedemptionFlow } from "./components/RedemptionFlow";\n'
          imports = (
              import_marker
              + 'import { GuardianProfileLite } from "./components/GuardianProfileLite";\n'
              + 'import { GuardianPetPassport } from "./components/GuardianPetPassport";\n'
          )
          if 'GuardianProfileLite' not in text:
              if import_marker not in text:
                  raise SystemExit('RedemptionFlow import marker not found')
              text = text.replace(import_marker, imports, 1)

          next_cards = '          <div className="nextCards">\n'
          profile_insert = (
              '          {kind === "guardian" && (\n'
              '            <GuardianProfileLite session={session} />\n'
              '          )}\n'
          )
          if '<GuardianProfileLite session={session} />' not in text:
              if next_cards not in text:
                  raise SystemExit('nextCards marker not found')
              text = text.replace(next_cards, profile_insert + next_cards, 1)

          start = text.index('function GuardianPetDetail() {')
          end = text.index('function PartnerProfileRoute() {', start)
          replacement = '''function GuardianPetDetail() {
            const { session } = useAuth();
            const { petId } = useParams();
            return (
              <Page>
                <GuardianPetPassport session={session} petId={petId || ""} />
              </Page>
            );
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Format CP1 files
        run: npx prettier --write src/main.tsx src/components/GuardianProfileLite.tsx src/components/GuardianPetPassport.tsx e2e/phase-3-guardian-passport.spec.ts .github/workflows/persona-qa.yml supabase/migrations/20260910092500_phase_3_guardian_passport_authority.sql supabase/tests/phase_3_guardian_passport_authority.sql
      - name: Remove temporary helper and commit
        shell: bash
        run: |
          git rm .github/workflows/phase3-cp1-wire.yml
          git config user.name "ShelterPawtners automation"
          git config user.email "shelterpawtners@gmail.com"
          git add src/main.tsx src/components/GuardianProfileLite.tsx src/components/GuardianPetPassport.tsx e2e/phase-3-guardian-passport.spec.ts .github/workflows/persona-qa.yml supabase/migrations/20260910092500_phase_3_guardian_passport_authority.sql supabase/tests/phase_3_guardian_passport_authority.sql
          git diff --cached --quiet && exit 0
          git commit -m "Wire and format Phase 3 Guardian Passport CP1"
          git push origin HEAD:phase3/guardian-passport-foundation
