name: AI Build Orchestrator

on:
  workflow_run:
    workflows:
      - CI
      - Persona QA
      - Hosted QA
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ai-build-orchestrator-${{ github.event.workflow_run.head_branch || 'scheduled' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  advance-after-acceptance:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Persona QA' || github.event.workflow_run.name == 'Hosted QA')
    runs-on: ubuntu-latest
    steps:
      - name: Continue only after a checkpoint reaches an acceptance state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${HEAD_BRANCH}" --jq '.content' | base64 --decode)

          grep -Eq '^SAFE_TO_CONTINUE:[[:space:]]*YES[[:space:]]*$' <<<"${handoff}" || {
            echo "Handoff does not authorize automatic continuation."
            exit 0
          }
          grep -Eq '^OWNER_DECISION_REQUIRED:[[:space:]]*NO[[:space:]]*$' <<<"${handoff}" || {
            echo "Handoff requires an owner decision."
            exit 0
          }
          grep -Eq '^STATUS:[[:space:]]*(READY_FOR_ACCEPTANCE|COMPLETE)[[:space:]]*$' <<<"${handoff}" || {
            echo "Checkpoint is still IN_PROGRESS; a routine green run must not spend another AI session."
            exit 0
          }

          next_checkpoint=$(sed -n 's/^NEXT_CHECKPOINT:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          checkpoint_key=$(printf '%s' "${next_checkpoint:-none}" | sha256sum | cut -c1-16)
          marker="<!-- ai-build-orchestrator-advance:${checkpoint_key} -->"

          comments=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate)
          if jq -e --arg marker "${marker}" '[.[] | select(.body | contains($marker))] | length > 0' <<<"${comments}" >/dev/null; then
            echo "This next checkpoint was already delegated."
            exit 0
          fi

          body=$(cat <<EOF
          ${marker}
          @copilot Automated continuation after successful **${WORKFLOW_NAME}** acceptance.

          Accepted run: ${RUN_URL}
          Accepted SHA: \`${HEAD_SHA}\`
          Next checkpoint from \`docs/AI-HANDOFF.md\`: **${next_checkpoint:-read the current handoff and continue the next authorized Phase 2 task}**

          This is one bounded checkpoint-level invocation. Work through implementation, targeted validation, and related GREEN/YELLOW defects in this session. Do not request a new Copilot session for each green CI/Hosted QA commit. Follow \`docs/AI-COST-AND-TESTING-GOVERNANCE.md\`. Phase 3 remains blocked; do not auto-merge.
          EOF
          )

          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"

  scheduled-supervisor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Discover and inspect the active build PR every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTIVE_MARKER: "<!-- ai-active-build-pr -->"
          STALE_MINUTES: "30"
        shell: bash
        run: |
          set -euo pipefail

          prs=$(gh api "repos/${REPO}/pulls?state=open&base=build/festival-mvp&per_page=100")
          active_numbers=$(jq -r --arg marker "${ACTIVE_MARKER}" '.[] | select((.body // "") | contains($marker)) | .number' <<<"${prs}")
          active_count=$(grep -c . <<<"${active_numbers}" || true)

          if [[ "${active_count}" == "0" ]]; then
            echo "No open PR is marked as the active build lane; nothing to supervise."
            exit 0
          fi
          if [[ "${active_count}" != "1" ]]; then
            echo "Expected exactly one active build PR marker, found ${active_count}; stop to avoid supervising the wrong branch." >&2
            exit 1
          fi

          PR_NUMBER=$(head -n 1 <<<"${active_numbers}")
          pr=$(jq -c --argjson n "${PR_NUMBER}" '.[] | select(.number == $n)' <<<"${prs}")
          head_branch=$(jq -r '.head.ref' <<<"${pr}")
          head_sha=$(jq -r '.head.sha' <<<"${pr}")
          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${head_branch}" --jq '.content' | base64 --decode)
          runs=$(gh api "repos/${REPO}/actions/runs?branch=${head_branch}&per_page=50")

          in_flight=$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length' <<<"${runs}")
          [[ "${in_flight}" == "0" ]] || {
            echo "Workflow activity is in flight; no agent re-invocation."
            exit 0
          }

          current_checkpoint=$(sed -n 's/^CURRENT_CHECKPOINT:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          checkpoint_key=$(printf '%s' "${current_checkpoint:-unknown}" | sha256sum | cut -c1-16)
          recovery_marker="<!-- ai-build-supervisor-recovery:${checkpoint_key} -->"
          comments=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate)

          if jq -e --arg marker "${recovery_marker}" '[.[] | select(.body | contains($marker))] | length > 0' <<<"${comments}" >/dev/null; then
            echo "One automatic stale recovery has already been used for this checkpoint; do not spend another AI session."
            exit 0
          fi

          commit=$(gh api "repos/${REPO}/commits/${head_sha}")
          commit_time=$(jq -r '.commit.committer.date' <<<"${commit}")
          now_epoch=$(date -u +%s)
          commit_epoch=$(date -u -d "${commit_time}" +%s)
          age_minutes=$(( (now_epoch - commit_epoch) / 60 ))

          latest_bad=$(jq -r --arg sha "${head_sha}" '
            [.workflow_runs[]
              | select(.head_sha == $sha and (.name == "CI" or .name == "Persona QA" or .name == "Hosted QA"))]
            | sort_by(.name, .created_at)
            | group_by(.name)
            | map(last)
            | map(select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required"))
            | sort_by(.created_at)
            | last // empty
            | if . == "" then "" else "\(.name)|\(.conclusion)|\(.html_url)" end
          ' <<<"${runs}")

          if [[ -n "${latest_bad}" ]] && (( age_minutes >= STALE_MINUTES )); then
            IFS='|' read -r workflow conclusion run_url <<<"${latest_bad}"
            body=$(cat <<EOF
          ${recovery_marker}
          @copilot One cost-controlled stale recovery for **${current_checkpoint:-current Phase 2 checkpoint}**.

          The latest **${workflow}** state is **${conclusion}** at \`${head_sha}\`, no workflow is running, and there has been no newer commit for ${age_minutes} minutes.
          Run: ${run_url}

          Continue the existing bounded checkpoint. Fix GREEN/YELLOW defects autonomously and use native tests for deterministic validation. This checkpoint will not receive another automatic AI re-kick. Do not weaken tests/RLS, touch production, auto-merge, or begin Phase 3. Update \`docs/AI-HANDOFF.md\` when state changes.
          EOF
            )
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"
            exit 0
          fi

          if grep -Eq '^STATUS:[[:space:]]*IN_PROGRESS[[:space:]]*$' <<<"${handoff}" &&
             grep -Eq '^SAFE_TO_CONTINUE:[[:space:]]*YES[[:space:]]*$' <<<"${handoff}" &&
             grep -Eq '^OWNER_DECISION_REQUIRED:[[:space:]]*NO[[:space:]]*$' <<<"${handoff}" &&
             (( age_minutes >= STALE_MINUTES )); then
            body=$(cat <<EOF
          ${recovery_marker}
          @copilot One cost-controlled stale recovery for **${current_checkpoint:-current Phase 2 checkpoint}**.

          No workflow is running and the branch has had no new commit for ${age_minutes} minutes. Continue the existing bounded task; do not broaden scope. This checkpoint will not receive another automatic AI re-kick. Follow \`docs/AI-COST-AND-TESTING-GOVERNANCE.md\`. Phase 3 remains blocked and no auto-merge is allowed.
          EOF
            )
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"
          fi
