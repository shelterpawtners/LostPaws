name: AI Build Orchestrator

on:
  workflow_run:
    workflows:
      - CI
      - Persona QA
      - Hosted QA
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ai-build-orchestrator-${{ github.event.workflow_run.head_branch || 'scheduled' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  delegate-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      contains(fromJSON('["failure","timed_out","cancelled","action_required"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Delegate failed run to Copilot on the existing PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- ai-build-orchestrator-failure:${WORKFLOW_NAME}:${HEAD_SHA} -->"

          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq "${marker}"; then
            echo "Failure for this workflow/SHA was already delegated."
            exit 0
          fi

          body=$(cat <<EOF
          ${marker}
          @copilot Automated failure triage request.

          **${WORKFLOW_NAME}** failed for branch \`${HEAD_BRANCH}\` at \`${HEAD_SHA}\`.
          Run: ${RUN_URL}

          Work autonomously on this existing PR/branch. Inspect the failed run and logs, determine the root cause, and fix GREEN/YELLOW engineering defects without waiting for Jim. Read \`AGENTS.md\`, \`docs/CURRENT-WORK.md\`, \`docs/AI-OPERATING-PROTOCOL.md\`, \`docs/AUTONOMOUS-EXECUTION-POLICY.md\`, \`docs/OWNER-DECISION-BACKLOG.md\`, and \`docs/AI-HANDOFF.md\` first.

          Guardrails: do not weaken tests or RLS, do not expose secrets, do not touch production/DNS, do not auto-merge, and do not begin Phase 3. The remainder of Phase 2 is authorized. Update \`docs/AI-HANDOFF.md\` before declaring the blocker resolved.
          EOF
          )

          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"

  advance-after-acceptance:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Persona QA' || github.event.workflow_run.name == 'Hosted QA')
    runs-on: ubuntu-latest
    steps:
      - name: Continue next authorized task when handoff allows it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${HEAD_BRANCH}" --jq '.content' | base64 --decode)

          if ! grep -Eq '^SAFE_TO_CONTINUE:[[:space:]]*YES[[:space:]]*$' <<<"${handoff}"; then
            echo "Handoff does not authorize automatic continuation."
            exit 0
          fi

          if ! grep -Eq '^OWNER_DECISION_REQUIRED:[[:space:]]*NO[[:space:]]*$' <<<"${handoff}"; then
            echo "Handoff requires an owner decision."
            exit 0
          fi

          marker="<!-- ai-build-orchestrator-advance:${HEAD_SHA} -->"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq "${marker}"; then
            echo "This accepted SHA was already advanced."
            exit 0
          fi

          next_checkpoint=$(sed -n 's/^NEXT_CHECKPOINT:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          body=$(cat <<EOF
          ${marker}
          @copilot Automated continuation after successful **${WORKFLOW_NAME}** acceptance.

          Accepted run: ${RUN_URL}
          Accepted SHA: \`${HEAD_SHA}\`
          Next checkpoint from \`docs/AI-HANDOFF.md\`: **${next_checkpoint:-read the current handoff and continue the next authorized Phase 2 task}**

          Continue autonomously on this PR/branch under \`docs/AUTONOMOUS-EXECUTION-POLICY.md\`. Make routine GREEN decisions directly, log reversible YELLOW assumptions, and stop only for a RED decision or hard blocker. The remainder of Phase 2 is authorized; Phase 3 is not. Do not auto-merge. Update \`docs/AI-HANDOFF.md\` before declaring completion.
          EOF
          )

          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"

  scheduled-supervisor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect active Phase 2 PR every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "2"
        shell: bash
        run: |
          set -euo pipefail

          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          state=$(jq -r '.state' <<<"${pr}")
          [[ "${state}" == "open" ]] || { echo "Active PR is not open; nothing to supervise."; exit 0; }

          head_branch=$(jq -r '.head.ref' <<<"${pr}")
          head_sha=$(jq -r '.head.sha' <<<"${pr}")
          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${head_branch}" --jq '.content' | base64 --decode)

          runs=$(gh api "repos/${REPO}/actions/runs?branch=${head_branch}&per_page=30")
          latest_bad=$(jq -r --arg sha "${head_sha}" '
            .workflow_runs
            | map(select(.head_sha == $sha and (.name == "CI" or .name == "Persona QA" or .name == "Hosted QA")))
            | map(select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required"))
            | sort_by(.created_at) | last // empty
            | if . == "" then "" else "\(.name)|\(.conclusion)|\(.html_url)" end
          ' <<<"${runs}")

          if [[ -n "${latest_bad}" ]]; then
            IFS='|' read -r workflow conclusion run_url <<<"${latest_bad}"
            marker="<!-- ai-build-supervisor:${workflow}:${head_sha} -->"
            if ! gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq "${marker}"; then
              body=$(cat <<EOF
          ${marker}
          @copilot Five-minute supervisor detected **${workflow}** = **${conclusion}** at \`${head_sha}\`.
          Run: ${run_url}

          Inspect the run immediately. Fix GREEN/YELLOW engineering defects autonomously under the repo policies. If this is an environment/configuration blocker that cannot be changed from code, update \`docs/AI-HANDOFF.md\` with the exact missing configuration and stop narrowly rather than making unrelated product changes. Do not weaken tests/RLS, touch production, auto-merge, or begin Phase 3.
          EOF
              )
              gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"
            fi
            exit 0
          fi

          if grep -Eq '^STATUS:[[:space:]]*READY_FOR_ACCEPTANCE[[:space:]]*$' <<<"${handoff}" &&
             grep -Eq '^SAFE_TO_CONTINUE:[[:space:]]*YES[[:space:]]*$' <<<"${handoff}" &&
             grep -Eq '^OWNER_DECISION_REQUIRED:[[:space:]]*NO[[:space:]]*$' <<<"${handoff}"; then
            hosted_success=$(jq -r --arg sha "${head_sha}" '
              [.workflow_runs[] | select(.head_sha == $sha and .name == "Hosted QA" and .conclusion == "success")] | length
            ' <<<"${runs}")
            if [[ "${hosted_success}" == "0" ]]; then
              echo "Handoff is ready for acceptance but Hosted QA has not passed for the current SHA."
            fi
          fi
