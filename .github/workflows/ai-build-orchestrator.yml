name: AI Build Orchestrator

on:
  workflow_run:
    workflows:
      - CI
      - Persona QA
      - Hosted QA
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ai-build-orchestrator-${{ github.event.workflow_run.head_branch || 'scheduled' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  delegate-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      contains(fromJSON('["failure","timed_out","cancelled","action_required"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Record failure; defer Copilot re-invocation to stale-work supervisor
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- ai-build-orchestrator-failure-record:${WORKFLOW_NAME}:${HEAD_SHA} -->"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq "${marker}"; then
            echo "Failure already recorded."
            exit 0
          fi

          body=$(cat <<EOF
          ${marker}
          Automated supervisor recorded **${WORKFLOW_NAME}** failure at \`${HEAD_SHA}\`.
          Run: ${RUN_URL}

          No new Copilot session is started immediately. The five-minute supervisor will re-engage Copilot only if the failure remains unresolved and the branch is stale for at least 20 minutes. This preserves the same QA gate while reducing AI-credit usage.
          EOF
          )
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"

  advance-after-acceptance:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Persona QA' || github.event.workflow_run.name == 'Hosted QA')
    runs-on: ubuntu-latest
    steps:
      - name: Continue only after a checkpoint reaches an acceptance state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${HEAD_BRANCH}" --jq '.content' | base64 --decode)

          if ! grep -Eq '^SAFE_TO_CONTINUE:[[:space:]]*YES[[:space:]]*$' <<<"${handoff}"; then
            echo "Handoff does not authorize automatic continuation."
            exit 0
          fi
          if ! grep -Eq '^OWNER_DECISION_REQUIRED:[[:space:]]*NO[[:space:]]*$' <<<"${handoff}"; then
            echo "Handoff requires an owner decision."
            exit 0
          fi
          if ! grep -Eq '^STATUS:[[:space:]]*(READY_FOR_ACCEPTANCE|COMPLETE)[[:space:]]*$' <<<"${handoff}"; then
            echo "Checkpoint is still IN_PROGRESS; do not spend another Copilot session on a routine green run."
            exit 0
          fi

          next_checkpoint=$(sed -n 's/^NEXT_CHECKPOINT:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          checkpoint_key=$(printf '%s' "${next_checkpoint:-none}" | sha256sum | cut -c1-16)
          marker="<!-- ai-build-orchestrator-advance:${checkpoint_key} -->"
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq "${marker}"; then
            echo "This next checkpoint was already delegated."
            exit 0
          fi

          body=$(cat <<EOF
          ${marker}
          @copilot Automated continuation after successful **${WORKFLOW_NAME}** acceptance.

          Accepted run: ${RUN_URL}
          Accepted SHA: \`${HEAD_SHA}\`
          Next checkpoint from \`docs/AI-HANDOFF.md\`: **${next_checkpoint:-read the current handoff and continue the next authorized Phase 2 task}**

          This is one bounded checkpoint-level invocation. Work autonomously through implementation and local validation; do not request a new Copilot session for each green CI/Hosted QA commit. Make routine GREEN decisions directly, log reversible YELLOW assumptions, and stop only for a RED decision or hard blocker. The remainder of Phase 2 is authorized; Phase 3 is not. Do not auto-merge. Update \`docs/AI-HANDOFF.md\` before declaring completion.
          EOF
          )

          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"

  scheduled-supervisor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect active Phase 2 PR every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "2"
          STALE_MINUTES: "20"
        shell: bash
        run: |
          set -euo pipefail

          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          state=$(jq -r '.state' <<<"${pr}")
          [[ "${state}" == "open" ]] || { echo "Active PR is not open; nothing to supervise."; exit 0; }

          head_branch=$(jq -r '.head.ref' <<<"${pr}")
          head_sha=$(jq -r '.head.sha' <<<"${pr}")
          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${head_branch}" --jq '.content' | base64 --decode)
          runs=$(gh api "repos/${REPO}/actions/runs?branch=${head_branch}&per_page=30")

          in_flight=$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length' <<<"${runs}")
          [[ "${in_flight}" == "0" ]] || { echo "Workflow activity is in flight; no agent re-invocation."; exit 0; }

          commit=$(gh api "repos/${REPO}/commits/${head_sha}")
          commit_time=$(jq -r '.commit.committer.date' <<<"${commit}")
          now_epoch=$(date -u +%s)
          commit_epoch=$(date -u -d "${commit_time}" +%s)
          age_minutes=$(( (now_epoch - commit_epoch) / 60 ))

          latest_bad=$(jq -r --arg sha "${head_sha}" '
            .workflow_runs
            | map(select(.head_sha == $sha and (.name == "CI" or .name == "Persona QA" or .name == "Hosted QA")))
            | map(select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled" or .conclusion == "action_required"))
            | sort_by(.created_at) | last // empty
            | if . == "" then "" else "\(.name)|\(.conclusion)|\(.html_url)" end
          ' <<<"${runs}")

          if [[ -n "${latest_bad}" ]] && (( age_minutes >= STALE_MINUTES )); then
            IFS='|' read -r workflow conclusion run_url <<<"${latest_bad}"
            marker="<!-- ai-build-supervisor-stale-failure:${head_sha} -->"
            if ! gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq "${marker}"; then
              body=$(cat <<EOF
          ${marker}
          @copilot The five-minute supervisor found an unresolved **${workflow}** ${conclusion} at \`${head_sha}\` and no newer branch activity for ${age_minutes} minutes.
          Run: ${run_url}

          Re-engage this existing checkpoint only now because it is stale. Fix GREEN/YELLOW defects autonomously. Do not weaken tests/RLS, touch production, auto-merge, or begin Phase 3. Update \`docs/AI-HANDOFF.md\` when the checkpoint state changes.
          EOF
              )
              gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"
            fi
            exit 0
          fi

          if grep -Eq '^STATUS:[[:space:]]*IN_PROGRESS[[:space:]]*$' <<<"${handoff}" &&
             grep -Eq '^SAFE_TO_CONTINUE:[[:space:]]*YES[[:space:]]*$' <<<"${handoff}" &&
             grep -Eq '^OWNER_DECISION_REQUIRED:[[:space:]]*NO[[:space:]]*$' <<<"${handoff}" &&
             (( age_minutes >= STALE_MINUTES )); then
            marker="<!-- ai-build-supervisor-stalled:${head_sha} -->"
            if ! gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' | grep -Fq "${marker}"; then
              next_checkpoint=$(sed -n 's/^CURRENT_CHECKPOINT:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
              body=$(cat <<EOF
          ${marker}
          @copilot The active checkpoint appears stalled: **${next_checkpoint:-current Phase 2 checkpoint}**. No workflow is running and the branch has had no new commit for ${age_minutes} minutes.

          Continue the existing bounded task; do not broaden scope. This re-kick occurs only after the 20-minute stale threshold to conserve AI credits. Phase 3 remains blocked and no auto-merge is allowed.
          EOF
              )
              gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"
            fi
          fi
