name: AI Build Orchestrator

on:
  workflow_run:
    workflows:
      - CI
      - Database QA
      - Persona QA
      - Hosted QA
      - Merge Gate
    types:
      - completed
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: ai-build-orchestrator-${{ github.event.workflow_run.head_branch || 'scheduled' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  record-acceptance-state:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.name == 'Database QA' || github.event.workflow_run.name == 'Persona QA' || github.event.workflow_run.name == 'Hosted QA' || github.event.workflow_run.name == 'Merge Gate')
    runs-on: ubuntu-latest
    steps:
      - name: Record ready state without invoking an AI agent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTIVE_MARKER: "<!-- ai-active-build-pr -->"
        shell: bash
        run: |
          set -euo pipefail

          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          pr_body=$(jq -r '.body // ""' <<<"${pr}")
          [[ "${pr_body}" == *"${ACTIVE_MARKER}"* ]] || {
            echo "PR is not the marked active build lane."
            exit 0
          }

          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${HEAD_BRANCH}" --jq '.content' | base64 --decode)
          grep -Eq '^SAFE_TO_CONTINUE:[[:space:]]*YES[[:space:]]*$' <<<"${handoff}" || exit 0
          grep -Eq '^OWNER_DECISION_REQUIRED:[[:space:]]*NO[[:space:]]*$' <<<"${handoff}" || exit 0
          grep -Eq '^STATUS:[[:space:]]*(READY_FOR_ACCEPTANCE|COMPLETE)[[:space:]]*$' <<<"${handoff}" || exit 0

          next_checkpoint=$(sed -n 's/^NEXT_CHECKPOINT:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          checkpoint_key=$(printf '%s' "${next_checkpoint:-none}" | sha256sum | cut -c1-16)
          marker="<!-- ai-build-ready:${checkpoint_key} -->"
          comments=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")
          if jq -e --arg marker "${marker}" '[.[] | select(.body | contains($marker))] | length > 0' <<<"${comments}" >/dev/null; then
            echo "Ready state already recorded."
            exit 0
          fi

          body=$(cat <<EOF
          ${marker}
          **READY FOR NEXT OPERATOR TASK — no AI agent was started.**

          Accepted workflow: **${WORKFLOW_NAME}**
          Run: ${RUN_URL}
          SHA: \`${HEAD_SHA}\`
          Next checkpoint: **${next_checkpoint:-read docs/AI-HANDOFF.md}**

          Cost-control policy: GitHub Actions records readiness only. Start a coding agent intentionally only when reasoning/implementation is actually needed.
          EOF
          )
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"

  record-failure-state:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null &&
      contains(fromJSON('["failure","timed_out","cancelled","action_required"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Record failure without invoking an AI agent
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- ai-build-failed:${WORKFLOW_NAME}:${HEAD_SHA} -->"
          comments=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")
          if jq -e --arg marker "${marker}" '[.[] | select(.body | contains($marker))] | length > 0' <<<"${comments}" >/dev/null; then
            exit 0
          fi
          body=$(cat <<EOF
          ${marker}
          **FAILED / ATTENTION — no AI agent was started.**

          Workflow: **${WORKFLOW_NAME}**
          Conclusion: **${CONCLUSION}**
          Run: ${RUN_URL}
          SHA: \`${HEAD_SHA}\`

          Use the failure evidence when the next intentional debugging/implementation session begins.
          EOF
          )
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"

  scheduled-supervisor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect active build PR hourly without AI invocation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTIVE_MARKER: "<!-- ai-active-build-pr -->"
          STALE_MINUTES: "60"
        shell: bash
        run: |
          set -euo pipefail

          prs=$(gh api "repos/${REPO}/pulls?state=open&base=build/festival-mvp&per_page=100")
          active_numbers=$(jq -r --arg marker "${ACTIVE_MARKER}" '.[] | select((.body // "") | contains($marker)) | .number' <<<"${prs}")
          active_count=$(grep -c . <<<"${active_numbers}" || true)

          [[ "${active_count}" == "1" ]] || {
            echo "Expected exactly one active build PR marker; found ${active_count}."
            exit 0
          }

          PR_NUMBER=$(head -n 1 <<<"${active_numbers}")
          pr=$(jq -c --argjson n "${PR_NUMBER}" '.[] | select(.number == $n)' <<<"${prs}")
          head_branch=$(jq -r '.head.ref' <<<"${pr}")
          head_sha=$(jq -r '.head.sha' <<<"${pr}")
          handoff=$(gh api "repos/${REPO}/contents/docs/AI-HANDOFF.md?ref=${head_branch}" --jq '.content' | base64 --decode)
          runs=$(gh api "repos/${REPO}/actions/runs?branch=${head_branch}&per_page=50")

          in_flight=$(jq -r --arg sha "${head_sha}" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))] | length' <<<"${runs}")
          [[ "${in_flight}" == "0" ]] || {
            echo "Workflow activity is in flight."
            exit 0
          }

          commit=$(gh api "repos/${REPO}/commits/${head_sha}")
          commit_time=$(jq -r '.commit.committer.date' <<<"${commit}")
          now_epoch=$(date -u +%s)
          commit_epoch=$(date -u -d "${commit_time}" +%s)
          age_minutes=$(( (now_epoch - commit_epoch) / 60 ))
          (( age_minutes >= STALE_MINUTES )) || {
            echo "Branch is not stale."
            exit 0
          }

          current_checkpoint=$(sed -n 's/^CURRENT_CHECKPOINT:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          status=$(sed -n 's/^STATUS:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          owner=$(sed -n 's/^OWNER_DECISION_REQUIRED:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          safe=$(sed -n 's/^SAFE_TO_CONTINUE:[[:space:]]*//p' <<<"${handoff}" | head -n 1)
          marker="<!-- ai-build-stalled:${head_sha} -->"
          comments=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100")
          if jq -e --arg marker "${marker}" '[.[] | select(.body | contains($marker))] | length > 0' <<<"${comments}" >/dev/null; then
            exit 0
          fi

          body=$(cat <<EOF
          ${marker}
          **STALLED STATUS — no AI agent was started.**

          Checkpoint: **${current_checkpoint:-unknown}**
          Handoff status: **${status:-unknown}**
          SAFE_TO_CONTINUE: **${safe:-unknown}**
          OWNER_DECISION_REQUIRED: **${owner:-unknown}**
          SHA: \`${head_sha}\`
          No workflow is running and no new commit has appeared for ${age_minutes} minutes.

          This is a monitoring signal only. The next coding-agent session must be started intentionally under the cost-control policy.
          EOF
          )
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}"
