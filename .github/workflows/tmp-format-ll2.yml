name: Temporary LL-2 formatter

on:
  push:
    branches:
      - phase3/marketplace-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase3/marketplace-polish
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format and clean up
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            src/components/OfferCard.tsx \
            src/components/OfferMarketplace.tsx \
            src/marketplace-premium.css \
            e2e/marketplace-premium.spec.ts \
            package.json \
            docs/AI-HANDOFF.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-format-ll2.yml
          git add src/components/OfferCard.tsx src/components/OfferMarketplace.tsx src/marketplace-premium.css e2e/marketplace-premium.spec.ts package.json docs/AI-HANDOFF.md
          git commit -m "Format LL-2 Marketplace files"
          git push origin HEAD:phase3/marketplace-polish
