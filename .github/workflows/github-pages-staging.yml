name: GitHub Pages Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build GitHub Pages staging
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.QA_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_AUTH_ENABLED: "true"
          VITE_FACEBOOK_AUTH_ENABLED: "false"
          VITE_ADMIN_QA_MODE_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VITE_SUPABASE_URL}" || -z "${VITE_SUPABASE_PUBLISHABLE_KEY}" ]]; then
            echo 'ERROR: GitHub Pages staging requires the existing QA Supabase publishable configuration.' >&2
            exit 1
          fi
          npm run build

      - name: Rewrite root-relative public assets for project Pages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            sed -i 's#/brand/#/LostPaws/brand/#g' "$file"
          done < <(grep -RIl '/brand/' dist || true)

      - name: Verify compiled artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/LostPaws/assets/.*\.js' dist/index.html
          grep -q '/LostPaws/assets/.*\.css' dist/index.html
          if grep -RIl '/brand/' dist | xargs -r grep -Fn '"/brand/'; then
            echo 'ERROR: project Pages artifact still contains double-quoted root-relative brand assets.' >&2
            exit 1
          fi
          if grep -RIl '/brand/' dist | xargs -r grep -Fn "'/brand/"; then
            echo 'ERROR: project Pages artifact still contains single-quoted root-relative brand assets.' >&2
            exit 1
          fi
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'ERROR: dist/index.html still references source TypeScript.' >&2
            exit 1
          fi

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify live Pages site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify compiled app is publicly served
        shell: bash
        env:
          SITE_URL: https://shelterpawtners.github.io/LostPaws/
        run: |
          set -euo pipefail
          cache_bust="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          html=""

          for attempt in {1..12}; do
            html="$(curl -fsSL --retry 2 --retry-delay 2 "${SITE_URL}?release=${cache_bust}" || true)"
            if printf '%s' "$html" | grep -q '/LostPaws/assets/.*\.js' && \
               printf '%s' "$html" | grep -q '/LostPaws/assets/.*\.css'; then
              break
            fi
            echo "Pages release not visible yet (attempt ${attempt}/12)."
            sleep 5
          done

          printf '%s' "$html" > /tmp/live-index.html
          echo 'Live index asset references:'
          grep -oE '/LostPaws/assets/[^" ]+' /tmp/live-index.html || true

          if grep -q '/src/main.tsx' /tmp/live-index.html; then
            echo 'ERROR: GitHub Pages is serving the raw repository index.html instead of the compiled artifact.' >&2
            exit 1
          fi

          js_path="$(grep -oE '/LostPaws/assets/[^" ]+\.js' /tmp/live-index.html | head -1)"
          css_path="$(grep -oE '/LostPaws/assets/[^" ]+\.css' /tmp/live-index.html | head -1)"

          if [[ -z "$js_path" || -z "$css_path" ]]; then
            echo 'ERROR: Live page does not reference the compiled JS and CSS assets.' >&2
            cat /tmp/live-index.html >&2
            exit 1
          fi

          curl -fsSL "https://shelterpawtners.github.io${js_path}?release=${cache_bust}" -o /tmp/app.js
          curl -fsSL "https://shelterpawtners.github.io${css_path}?release=${cache_bust}" -o /tmp/app.css
          test -s /tmp/app.js
          test -s /tmp/app.css
          grep -q 'basename:`/LostPaws`' /tmp/app.js
          grep -q '\.skip' /tmp/app.css

      - name: Checkout for browser verification
        uses: actions/checkout@v4

      - name: Setup Node for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute live app in Chromium
        shell: bash
        env:
          SITE_URL: https://shelterpawtners.github.io/LostPaws/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          const failedResponses = [];
          page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
          page.on('console', msg => {
            if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
          });
          page.on('response', response => {
            if (response.status() >= 400) failedResponses.push(`${response.status()} ${response.url()}`);
          });
          const url = `${process.env.SITE_URL}?browser=${process.env.GITHUB_SHA || Date.now()}`;
          const response = await page.goto(url, { waitUntil: 'networkidle' });
          if (!response || !response.ok()) throw new Error(`Navigation failed: ${response?.status()}`);
          await page.getByRole('heading', { name: 'Better pet care starts with a connected community.' }).waitFor({ timeout: 15000 });
          await page.getByRole('heading', { name: 'Music. Community. More resources for shelter pets.' }).waitFor({ timeout: 15000 });
          await page.getByRole('link', { name: 'See the RAVE Shelter mission' }).waitFor({ timeout: 15000 });
          const skipTransform = await page.locator('.skip').evaluate(el => getComputedStyle(el).transform);
          if (skipTransform === 'none') throw new Error('Skip link is visibly rendered instead of visually hidden.');
          if (failedResponses.length) throw new Error(`Failed browser responses:\n${failedResponses.join('\n')}`);
          if (errors.length) throw new Error(`Browser runtime errors:\n${errors.join('\n')}`);
          console.log('Chromium rendered the GitHub Pages app successfully with the unified RAVE mission and no failed resources.');
          await browser.close();
          EOF
