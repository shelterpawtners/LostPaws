name: Temporary format launch docs

on:
  push:
    branches:
      - fix/launch-docs-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/launch-docs-format
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only the two failing planning docs
        run: npx prettier --write docs/product/DUAL-MARKETPLACE-RAVE-SHELTER-EXECUTION-PLAN.md docs/product/PASSPORT-SAVINGS-IMPACT-MODEL.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product/DUAL-MARKETPLACE-RAVE-SHELTER-EXECUTION-PLAN.md docs/product/PASSPORT-SAVINGS-IMPACT-MODEL.md
          git commit -m "Format launch planning docs"
          git push
