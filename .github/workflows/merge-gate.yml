name: Merge Gate

on:
  pull_request:
    branches: [build/festival-mvp]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/classify-change-impact.sh "$BASE_SHA" "$HEAD_SHA"
      - name: PR size advisory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          files=$(jq -r '.changed_files' <<<"$pr")
          additions=$(jq -r '.additions' <<<"$pr")
          deletions=$(jq -r '.deletions' <<<"$pr")
          total=$((additions + deletions))
          {
            echo "### PR size"
            echo "- Changed files: ${files}"
            echo "- Changed lines: ${total}"
          } >> "$GITHUB_STEP_SUMMARY"
          if (( files > 25 || total > 1200 )); then
            echo "::warning::This PR is larger than the normal bounded-checkpoint target."
          fi
      - name: Enforce deterministic merge evidence at COMPLETE
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
          DB_REQUIRED: ${{ steps.impact.outputs.requires_db_qa }}
          PERSONA_REQUIRED: ${{ steps.impact.outputs.requires_persona_qa }}
          HOSTED_REQUIRED: ${{ steps.impact.outputs.requires_hosted_qa }}
          DEP_REQUIRED: ${{ steps.impact.outputs.requires_dependency_review }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(sed -n 's/^STATUS:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          owner=$(sed -n 's/^OWNER_DECISION_REQUIRED:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          safe=$(sed -n 's/^SAFE_TO_CONTINUE:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          accepted_sha=$(sed -n 's/^ACCEPTED_CODE_SHA:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          if [[ "$status" != "COMPLETE" ]]; then
            echo "Checkpoint is not COMPLETE; Merge Gate is informational during implementation/acceptance."
            exit 0
          fi
          [[ "$owner" == "NO" ]] || { echo "Owner decision still required." >&2; exit 1; }
          [[ "$safe" == "YES" ]] || { echo "SAFE_TO_CONTINUE is not YES." >&2; exit 1; }
          [[ -n "$accepted_sha" && "$accepted_sha" != "NONE" ]] || { echo "COMPLETE handoff must provide ACCEPTED_CODE_SHA." >&2; exit 1; }
          git merge-base --is-ancestor "$accepted_sha" "$CURRENT_HEAD" || { echo "Accepted SHA is not an ancestor of current head." >&2; exit 1; }

          wait_for_run() {
            local workflow="$1"
            local sha="$2"
            local required_job="${3:-}"
            local attempts=72
            for attempt in $(seq 1 "$attempts"); do
              runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&event=pull_request&per_page=100")
              run=$(jq -c --arg workflow "$workflow" '[.workflow_runs[] | select(.name == $workflow)] | sort_by(.created_at) | last // empty' <<<"$runs")
              if [[ -z "$run" ]]; then
                sleep 10
                continue
              fi
              run_status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              run_id=$(jq -r '.id' <<<"$run")
              if [[ "$run_status" != "completed" ]]; then
                sleep 10
                continue
              fi
              [[ "$conclusion" == "success" ]] || { echo "$workflow did not pass on $sha: $conclusion" >&2; return 1; }
              if [[ -n "$required_job" ]]; then
                jobs=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100")
                job_conclusion=$(jq -r --arg job "$required_job" '[.jobs[] | select(.name == $job)] | last | .conclusion // ""' <<<"$jobs")
                [[ "$job_conclusion" == "success" ]] || { echo "$workflow required job $required_job was ${job_conclusion:-missing}." >&2; return 1; }
              fi
              return 0
            done
            echo "Timed out waiting for $workflow on $sha." >&2
            return 1
          }

          require_database_evidence() {
            local candidate run run_id jobs job_conclusion remaining_db
            while read -r candidate; do
              [[ -n "$candidate" ]] || continue
              runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${candidate}&event=pull_request&per_page=100")
              run=$(jq -c '[.workflow_runs[] | select(.name == "Database QA" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$runs")
              [[ -n "$run" ]] || continue
              run_id=$(jq -r '.id' <<<"$run")
              jobs=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100")
              job_conclusion=$(jq -r '[.jobs[] | select(.name == "database")] | last | .conclusion // ""' <<<"$jobs")
              [[ "$job_conclusion" == "success" ]] || continue

              remaining_db=$(bash scripts/classify-change-impact.sh "$candidate" "$accepted_sha" | sed -n 's/^requires_db_qa=//p' | tail -n 1)
              if [[ "$remaining_db" == "false" ]]; then
                echo "Database QA evidence accepted from ${candidate}; no database-sensitive changes follow it through ${accepted_sha}."
                return 0
              fi
            done < <(git rev-list "$accepted_sha" "^$BASE_SHA")

            echo "No successful Database QA database job covers the final database-sensitive state through $accepted_sha." >&2
            return 1
          }

          wait_for_run "CI" "$CURRENT_HEAD"
          if [[ "$DB_REQUIRED" == "true" ]]; then require_database_evidence; fi
          if [[ "$PERSONA_REQUIRED" == "true" ]]; then wait_for_run "Persona QA" "$accepted_sha" "persona"; fi
          if [[ "$HOSTED_REQUIRED" == "true" ]]; then wait_for_run "Hosted QA" "$accepted_sha" "hosted-smoke"; fi
          if [[ "$DEP_REQUIRED" == "true" ]]; then wait_for_run "Dependency Review" "$accepted_sha" "dependency-review"; fi
          echo "All deterministic evidence required for this PR is present."
