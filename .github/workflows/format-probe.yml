name: Format probe

on:
  push:
    branches:
      - support/help-feedback-intake

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier src/components/HelpFeedback.tsx > /tmp/HelpFeedback.tsx
          diff -u src/components/HelpFeedback.tsx /tmp/HelpFeedback.tsx || true
