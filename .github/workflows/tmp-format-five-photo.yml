name: Temporary Five Photo Formatter

on:
  push:
    branches:
      - data-architecture/pet-media-guardian-feed

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format bounded files
        run: npx prettier --write src/components/PetMediaGallery.tsx e2e/guardian-pet-media.spec.ts
      - name: Commit formatted files and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "Shelter Pawtners"
          git config user.email "shelterpawtners@gmail.com"
          rm .github/workflows/tmp-format-five-photo.yml
          git add src/components/PetMediaGallery.tsx e2e/guardian-pet-media.spec.ts .github/workflows/tmp-format-five-photo.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format five-photo gallery changes"
          git push
