name: Hosted QA

on:
  pull_request:
    branches: [build/festival-mvp]
    paths:
      - "src/**"
      - "e2e/**"
      - ".github/workflows/hosted-qa.yml"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "supabase/**"
      - "docs/AI-HANDOFF.md"
  workflow_dispatch:
    inputs:
      qa_url:
        description: Vercel Preview HTTPS URL (defaults to the QA_BASE_URL repository variable)
        required: false
        type: string
      full_browser_audit:
        description: Run the broader Issue #5 browser suite
        required: false
        default: false
        type: boolean

concurrency:
  group: hosted-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    outputs:
      run_hosted: ${{ steps.gate.outputs.run_hosted }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        name: Run heavy hosted QA only at acceptance boundary
        shell: bash
        run: |
          set -euo pipefail
          status=$(sed -n 's/^STATUS:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          safe=$(sed -n 's/^SAFE_TO_CONTINUE:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          owner=$(sed -n 's/^OWNER_DECISION_REQUIRED:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)

          if [[ "${safe}" == "YES" && "${owner}" == "NO" && ( "${status}" == "READY_FOR_ACCEPTANCE" || "${status}" == "COMPLETE" ) ]]; then
            echo "run_hosted=true" >> "$GITHUB_OUTPUT"
            echo "Checkpoint is at an acceptance boundary; run hosted QA."
          else
            echo "run_hosted=false" >> "$GITHUB_OUTPUT"
            echo "Checkpoint is ${status:-unknown}; skip heavy hosted browser QA for this intermediate commit."
          fi

  hosted-smoke:
    needs: acceptance-gate
    if: needs.acceptance-gate.outputs.run_hosted == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.qa_url || vars.QA_BASE_URL || 'https://lost-paws-one.vercel.app' }}
      PLAYWRIGHT_HOSTED_QA: "true"
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.QA_SUPABASE_PUBLISHABLE_KEY }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.QA_PLATFORM_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.QA_PLATFORM_ADMIN_PASSWORD }}
      PLAYWRIGHT_NON_ADMIN_EMAIL: ${{ secrets.QA_NON_ADMIN_EMAIL }}
      PLAYWRIGHT_NON_ADMIN_PASSWORD: ${{ secrets.QA_NON_ADMIN_PASSWORD }}
      PLAYWRIGHT_GUARDIAN_EMAIL: ${{ secrets.QA_GUARDIAN_EMAIL }}
      PLAYWRIGHT_GUARDIAN_PASSWORD: ${{ secrets.QA_GUARDIAN_PASSWORD }}
      PLAYWRIGHT_PARTNER_EMAIL: ${{ secrets.QA_PARTNER_EMAIL }}
      PLAYWRIGHT_PARTNER_PASSWORD: ${{ secrets.QA_PARTNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require handoff continuation authorization
        shell: bash
        run: |
          grep -q "^SAFE_TO_CONTINUE: YES$" docs/AI-HANDOFF.md || {
            echo "Hosted QA cannot advance when AI handoff is not SAFE_TO_CONTINUE: YES" >&2
            exit 1
          }
          grep -q "^OWNER_DECISION_REQUIRED: NO$" docs/AI-HANDOFF.md || {
            echo "Hosted QA cannot advance while OWNER_DECISION_REQUIRED is not NO" >&2
            exit 1
          }
      - name: Require hosted QA configuration
        shell: bash
        run: |
          set -euo pipefail
          for setting in \
            PLAYWRIGHT_BASE_URL \
            PLAYWRIGHT_SUPABASE_URL \
            PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY \
            PLAYWRIGHT_ADMIN_EMAIL \
            PLAYWRIGHT_ADMIN_PASSWORD \
            PLAYWRIGHT_NON_ADMIN_EMAIL \
            PLAYWRIGHT_NON_ADMIN_PASSWORD \
            PLAYWRIGHT_GUARDIAN_EMAIL \
            PLAYWRIGHT_GUARDIAN_PASSWORD \
            PLAYWRIGHT_PARTNER_EMAIL \
            PLAYWRIGHT_PARTNER_PASSWORD; do
            [[ -n "${!setting}" ]] || { echo "Missing hosted QA setting: $setting" >&2; exit 1; }
          done
          [[ "$PLAYWRIGHT_BASE_URL" == https://* ]] || { echo "QA_BASE_URL must be HTTPS" >&2; exit 1; }
          [[ "$PLAYWRIGHT_BASE_URL" =~ ^https://[^/]+\.vercel\.app(/.*)?$ ]] || { echo "QA URL must be a Vercel URL on vercel.app" >&2; exit 1; }
          [[ "$PLAYWRIGHT_SUPABASE_URL" =~ ^https://jukmlmryykcnjtpblbja\.supabase\.co/?$ ]] || {
            echo "QA_SUPABASE_URL must point to shelterpawtners-dev" >&2
            exit 1
          }
      - name: Wait for this web commit to be Ready on Vercel
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QA_URL: ${{ vars.QA_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          # If the deployed web artifact cannot change, no new Vercel deployment
          # is required and the existing QA URL is the correct target.
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --quiet HEAD^ HEAD -- \
            src public index.html package.json package-lock.json \
            vite.config.ts vite.config.js tsconfig.json tsconfig.app.json tsconfig.node.json; then
            echo "No frontend/build-impacting change in this commit; Vercel readiness wait is unnecessary."
            exit 0
          fi

          commit_time=$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.committer.date')
          echo "Waiting for Vercel bot to report Ready for the current web-impacting commit (${HEAD_SHA})."

          for attempt in $(seq 1 30); do
            ready=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate --jq \
              --arg commit_time "${commit_time}" --arg qa_url "${QA_URL}" \
              '[.[] | select(.user.login == "vercel[bot]") | select(.updated_at >= $commit_time) | select(.body | contains("Ready")) | select(.body | contains($qa_url))] | length')
            if [[ "${ready}" -gt 0 ]]; then
              echo "Vercel reports the current QA deployment Ready."
              exit 0
            fi
            echo "Vercel deployment not Ready yet (attempt ${attempt}/30)."
            sleep 10
          done

          echo "Timed out waiting for Vercel Ready state for the current web-impacting commit. Hosted QA will not test a potentially stale deployment." >&2
          exit 1
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run hosted smoke
        run: npm run test:e2e:hosted
      - name: Run Issue 5 browser audit
        if: ${{ inputs.full_browser_audit }}
        run: npx playwright test e2e/phase-1-accessibility.spec.ts e2e/phase-1-auth.spec.ts e2e/guardian-dashboard.spec.ts e2e/persona-access-isolation.spec.ts e2e/persona-registration.spec.ts e2e/phase-2-partner-onboarding.spec.ts e2e/phase-2-offer-redemption.spec.ts
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-playwright-results
          path: test-results/
          if-no-files-found: ignore
