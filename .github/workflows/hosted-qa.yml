name: Hosted QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      qa_url:
        description: Vercel Preview HTTPS URL (defaults to QA_BASE_URL)
        required: false
        type: string
      full_browser_audit:
        description: Run the broader Issue #5 browser suite
        required: false
        default: false
        type: boolean

concurrency:
  group: hosted-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    outputs:
      run_hosted: ${{ steps.gate.outputs.run_hosted }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/classify-change-impact.sh "$BASE_SHA" "$HEAD_SHA"
      - id: gate
        name: Run heavy Hosted QA only at the active acceptance boundary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTIVE_MARKER: "<!-- ai-active-build-pr -->"
          HOSTED_REQUIRED: ${{ steps.impact.outputs.requires_hosted_qa }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "run_hosted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(sed -n 's/^STATUS:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          safe=$(sed -n 's/^SAFE_TO_CONTINUE:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          owner=$(sed -n 's/^OWNER_DECISION_REQUIRED:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          prs=$(gh api "repos/${REPO}/pulls?state=open&base=main&per_page=100")
          pr_number=$(jq -r --arg branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" --arg marker "${ACTIVE_MARKER}" '[.[] | select(.head.ref == $branch) | select((.body // "") | contains($marker))] | if length == 1 then .[0].number else empty end' <<<"${prs}")
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          if [[ -z "${pr_number}" ]]; then
            echo "run_hosted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${HOSTED_REQUIRED}" == "true" && "${safe}" == "YES" && "${owner}" == "NO" && "${status}" == "READY_FOR_ACCEPTANCE" ]]; then
            echo "run_hosted=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_hosted=false" >> "$GITHUB_OUTPUT"
          fi

  hosted-smoke:
    needs: acceptance-gate
    if: needs.acceptance-gate.outputs.run_hosted == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_HOSTED_QA: "true"
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.QA_SUPABASE_PUBLISHABLE_KEY }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.QA_PLATFORM_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.QA_PLATFORM_ADMIN_PASSWORD }}
      PLAYWRIGHT_GUARDIAN_EMAIL: ${{ secrets.QA_GUARDIAN_EMAIL }}
      PLAYWRIGHT_GUARDIAN_PASSWORD: ${{ secrets.QA_GUARDIAN_PASSWORD }}
      PLAYWRIGHT_PARTNER_EMAIL: ${{ secrets.QA_PARTNER_EMAIL }}
      PLAYWRIGHT_PARTNER_PASSWORD: ${{ secrets.QA_PARTNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require handoff continuation authorization
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          grep -q "^STATUS: READY_FOR_ACCEPTANCE$" docs/AI-HANDOFF.md
          grep -q "^SAFE_TO_CONTINUE: YES$" docs/AI-HANDOFF.md
          grep -q "^OWNER_DECISION_REQUIRED: NO$" docs/AI-HANDOFF.md
      - name: Resolve acceptance runtime and deployed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.acceptance-gate.outputs.pr_number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_QA_URL: ${{ inputs.qa_url }}
          FALLBACK_QA_URL: ${{ vars.QA_BASE_URL || 'https://lost-paws-one.vercel.app' }}
        shell: bash
        run: |
          set -euo pipefail

          acceptance_runtime=$(sed -n 's/^ACCEPTANCE_RUNTIME:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          if [[ "${acceptance_runtime}" == "LOCAL_HEAD" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "PLAYWRIGHT_QA_RUNTIME=local" >> "$GITHUB_ENV"
            echo "Exact-code acceptance runtime: local Vite server at PR head ${PR_HEAD_SHA}."
            exit 0
          fi

          echo "PLAYWRIGHT_QA_RUNTIME=vercel" >> "$GITHUB_ENV"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || -z "${PR_NUMBER}" ]]; then
            qa_url="${INPUT_QA_URL:-${FALLBACK_QA_URL}}"
          else
            frontend_sha=$(bash scripts/latest-frontend-artifact-sha.sh "${BASE_SHA}" "${PR_HEAD_SHA")
            acceptance_deployed_sha=$(sed -n 's/^ACCEPTANCE_DEPLOYED_SHA:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)

            if [[ -n "${acceptance_deployed_sha}" && "${acceptance_deployed_sha}" != "NONE" && "${acceptance_deployed_sha}" != "${frontend_sha}" ]]; then
              echo "Requested reusable deployed frontend SHA: ${acceptance_deployed_sha}"
              bash scripts/verify-prettier-equivalent-frontend.sh "${acceptance_deployed_sha}" "${PR_HEAD_SHA}"
              frontend_sha="${acceptance_deployed_sha}"
            fi

            if [[ -n "${frontend_sha}" ]]; then
              echo "Latest deployed-artifact PR SHA: ${frontend_sha}"
              for attempt in $(seq 1 30); do
                vercel_state=$(gh api "repos/${REPO}/commits/${frontend_sha}/status" --jq '[.statuses[] | select(.context == "Vercel")] | first | .state // "missing"')
                case "${vercel_state}" in
                  success)
                    echo "Vercel deployment for ${frontend_sha} is successful."
                    break
                    ;;
                  failure|error)
                    echo "Vercel deployment for ${frontend_sha} is ${vercel_state}." >&2
                    exit 1
                    ;;
                  *)
                    if [[ "${attempt}" == "30" ]]; then
                      echo "Timed out waiting for Vercel status on ${frontend_sha}." >&2
                      exit 1
                    fi
                    sleep 10
                    ;;
                esac
              done

              comments=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate)
              qa_url=$(jq -r '[.[] | select(.user.login == "vercel[bot]") | (.body // "") | select(contains("[Preview]("))] | last | try capture("\\[Preview\\]\\((?<url>https://[^)]+\\.vercel\\.app[^)]*)\\)").url catch ""' <<<"${comments}")
              if [[ -z "${qa_url}" ]]; then
                qa_url="${FALLBACK_QA_URL}"
              fi
            else
              echo "No deployed frontend artifact changed in this PR; use the stable QA deployment."
              qa_url="${FALLBACK_QA_URL}"
            fi
          fi

          qa_url=${qa_url%/}
          [[ "${qa_url}" == https://* ]] || { echo "Hosted QA URL must be HTTPS." >&2; exit 1; }
          [[ "${qa_url}" =~ ^https://[^/]+\.vercel\.app(/.*)?$ ]] || { echo "Hosted QA URL must be a Vercel URL." >&2; exit 1; }
          echo "PLAYWRIGHT_BASE_URL=${qa_url}" >> "$GITHUB_ENV"
          echo "Hosted QA target: ${qa_url}"
      - name: Require hosted QA configuration
        shell: bash
        run: |
          set -euo pipefail
          for setting in PLAYWRIGHT_SUPABASE_URL PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY PLAYWRIGHT_ADMIN_EMAIL PLAYWRIGHT_ADMIN_PASSWORD PLAYWRIGHT_GUARDIAN_EMAIL PLAYWRIGHT_GUARDIAN_PASSWORD PLAYWRIGHT_PARTNER_EMAIL PLAYWRIGHT_PARTNER_PASSWORD; do
            [[ -n "${!setting}" ]] || { echo "Missing hosted QA setting: $setting" >&2; exit 1; }
          done
          if [[ "${PLAYWRIGHT_QA_RUNTIME:-vercel}" == "vercel" ]]; then
            [[ -n "${PLAYWRIGHT_BASE_URL:-}" ]] || { echo "Missing hosted QA setting: PLAYWRIGHT_BASE_URL" >&2; exit 1; }
          fi
          [[ "$PLAYWRIGHT_SUPABASE_URL" =~ ^https://jukmlmryykcnjtpblbja\.supabase\.co/?$ ]]
      - name: Install design QA dependencies
        run: bash scripts/install-design-qa-deps.sh
      - name: Install Chromium
        run: bash scripts/install-playwright-chromium.sh
      - name: Run hosted golden paths
        run: npm run test:e2e:hosted
      - name: Run hosted design QA
        run: npx playwright test e2e/hosted-design-qa.spec.ts
      - name: Upload hosted design QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-design-qa-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Run Issue 5 browser audit
        env:
          FULL_BROWSER_AUDIT: ${{ inputs.full_browser_audit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FULL_BROWSER_AUDIT:-false}" != "true" ]] && ! grep -q "^CURRENT_CHECKPOINT: Issue #5" docs/AI-HANDOFF.md; then
            echo "Issue #5 full browser audit is not active for this acceptance run."
            exit 0
          fi
          npx playwright test e2e/issue-5-human-audit.spec.ts
          npx playwright test e2e/admin-qa-mode.spec.ts
          npx playwright test e2e/phase-1-accessibility.spec.ts e2e/phase-1-auth.spec.ts e2e/guardian-dashboard.spec.ts e2e/persona-access-isolation.spec.ts e2e/persona-registration.spec.ts e2e/phase-2-partner-onboarding.spec.ts e2e/phase-2-offer-redemption.spec.ts
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-playwright-results
          path: test-results/
          if-no-files-found: ignore

  hosted-gate:
    name: Hosted QA Gate
    if: always()
    needs: [acceptance-gate, hosted-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require Hosted QA only when gated on
        env:
          GATE_RESULT: ${{ needs.acceptance-gate.result }}
          REQUIRED: ${{ needs.acceptance-gate.outputs.run_hosted }}
          HOSTED_RESULT: ${{ needs.hosted-smoke.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GATE_RESULT" == "success" ]] || exit 1
          if [[ "$REQUIRED" == "true" && "$HOSTED_RESULT" != "success" ]]; then
            exit 1
          fi
          echo "Hosted QA requirement satisfied."
