name: Hosted QA

on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - ".github/workflows/hosted-qa.yml"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "supabase/**"
      - "docs/AI-HANDOFF.md"
  workflow_dispatch:
    inputs:
      qa_url:
        description: Vercel Preview HTTPS URL (defaults to the QA_BASE_URL repository variable)
        required: false
        type: string
      full_browser_audit:
        description: Run the broader Issue #5 browser suite
        required: false
        default: false
        type: boolean

concurrency:
  group: hosted-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    outputs:
      run_hosted: ${{ steps.gate.outputs.run_hosted }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: gate
        name: Run heavy hosted QA only at active acceptance boundary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTIVE_MARKER: "<!-- ai-active-build-pr -->"
        shell: bash
        run: |
          set -euo pipefail
          status=$(sed -n 's/^STATUS:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          safe=$(sed -n 's/^SAFE_TO_CONTINUE:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)
          owner=$(sed -n 's/^OWNER_DECISION_REQUIRED:[[:space:]]*//p' docs/AI-HANDOFF.md | head -n 1)

          prs=$(gh api "repos/${REPO}/pulls?state=open&base=build/festival-mvp&per_page=100")
          pr_number=$(jq -r --arg branch "${GITHUB_REF_NAME}" --arg marker "${ACTIVE_MARKER}" \
            '[.[] | select(.head.ref == $branch) | select((.body // "") | contains($marker))] | if length == 1 then .[0].number else empty end' <<<"${prs}")
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "run_hosted=true" >> "$GITHUB_OUTPUT"
            echo "Manual Hosted QA requested."
            exit 0
          fi

          if [[ -z "${pr_number}" ]]; then
            echo "run_hosted=false" >> "$GITHUB_OUTPUT"
            echo "This branch is not the single active build PR; skip hosted QA."
            exit 0
          fi

          # Automatic full browser acceptance is run exactly when a checkpoint
          # is READY. COMPLETE is documentary state and must not repeat the suite.
          if [[ "${safe}" == "YES" && "${owner}" == "NO" && "${status}" == "READY_FOR_ACCEPTANCE" ]]; then
            echo "run_hosted=true" >> "$GITHUB_OUTPUT"
            echo "Active checkpoint is READY_FOR_ACCEPTANCE; run hosted QA."
          else
            echo "run_hosted=false" >> "$GITHUB_OUTPUT"
            echo "Checkpoint is ${status:-unknown}; skip heavy hosted browser QA."
          fi

  hosted-smoke:
    needs: acceptance-gate
    if: needs.acceptance-gate.outputs.run_hosted == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.qa_url || vars.QA_BASE_URL || 'https://lost-paws-one.vercel.app' }}
      PLAYWRIGHT_HOSTED_QA: "true"
      PLAYWRIGHT_SUPABASE_URL: ${{ vars.QA_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.QA_SUPABASE_PUBLISHABLE_KEY }}
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.QA_PLATFORM_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.QA_PLATFORM_ADMIN_PASSWORD }}
      PLAYWRIGHT_GUARDIAN_EMAIL: ${{ secrets.QA_GUARDIAN_EMAIL }}
      PLAYWRIGHT_GUARDIAN_PASSWORD: ${{ secrets.QA_GUARDIAN_PASSWORD }}
      PLAYWRIGHT_PARTNER_EMAIL: ${{ secrets.QA_PARTNER_EMAIL }}
      PLAYWRIGHT_PARTNER_PASSWORD: ${{ secrets.QA_PARTNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Require handoff continuation authorization
        shell: bash
        run: |
          grep -q "^SAFE_TO_CONTINUE: YES$" docs/AI-HANDOFF.md || {
            echo "Hosted QA cannot advance when AI handoff is not SAFE_TO_CONTINUE: YES" >&2
            exit 1
          }
          grep -q "^OWNER_DECISION_REQUIRED: NO$" docs/AI-HANDOFF.md || {
            echo "Hosted QA cannot advance while OWNER_DECISION_REQUIRED is not NO" >&2
            exit 1
          }
      - name: Require hosted QA configuration
        shell: bash
        run: |
          set -euo pipefail
          for setting in \
            PLAYWRIGHT_BASE_URL \
            PLAYWRIGHT_SUPABASE_URL \
            PLAYWRIGHT_SUPABASE_PUBLISHABLE_KEY \
            PLAYWRIGHT_ADMIN_EMAIL \
            PLAYWRIGHT_ADMIN_PASSWORD \
            PLAYWRIGHT_GUARDIAN_EMAIL \
            PLAYWRIGHT_GUARDIAN_PASSWORD \
            PLAYWRIGHT_PARTNER_EMAIL \
            PLAYWRIGHT_PARTNER_PASSWORD; do
            [[ -n "${!setting}" ]] || { echo "Missing hosted QA setting: $setting" >&2; exit 1; }
          done
          [[ "$PLAYWRIGHT_BASE_URL" == https://* ]] || { echo "QA_BASE_URL must be HTTPS" >&2; exit 1; }
          [[ "$PLAYWRIGHT_BASE_URL" =~ ^https://[^/]+\.vercel\.app(/.*)?$ ]] || { echo "QA URL must be a Vercel URL on vercel.app" >&2; exit 1; }
          [[ "$PLAYWRIGHT_SUPABASE_URL" =~ ^https://jukmlmryykcnjtpblbja\.supabase\.co/?$ ]] || {
            echo "QA_SUPABASE_URL must point to shelterpawtners-dev" >&2
            exit 1
          }
      - name: Wait for latest frontend-impacting SHA to be Ready on Vercel
        if: needs.acceptance-gate.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.acceptance-gate.outputs.pr_number }}
          QA_URL: ${{ vars.QA_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          frontend_sha=$(git log -1 --format=%H -- \
            src public index.html package.json package-lock.json vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json || true)
          if [[ -z "${frontend_sha}" ]]; then
            echo "No frontend-impacting commit found; use the existing QA deployment."
            exit 0
          fi

          commit_time=$(gh api "repos/${REPO}/commits/${frontend_sha}" --jq '.commit.committer.date')
          qa_url=${QA_URL%/}
          echo "Waiting for Vercel Ready state at or after frontend SHA ${frontend_sha}."

          for attempt in $(seq 1 30); do
            comments=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --paginate)
            ready=$(jq --arg commit_time "${commit_time}" --arg qa_url "${qa_url}" \
              '[.[] | select(.user.login == "vercel[bot]") | select(.updated_at >= $commit_time) | select(.body | contains("Ready")) | select(.body | contains($qa_url))] | length' \
              <<<"${comments}")
            if [[ "${ready}" -gt 0 ]]; then
              echo "Vercel reports the latest frontend-impacting deployment Ready."
              exit 0
            fi
            echo "Vercel deployment not Ready yet (attempt ${attempt}/30)."
            sleep 10
          done

          echo "Timed out waiting for Vercel Ready state after the latest frontend-impacting commit. Hosted QA will not test a potentially stale deployment." >&2
          exit 1
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run hosted smoke
        run: npm run test:e2e:hosted
      - name: Run Issue 5 browser audit
        if: ${{ inputs.full_browser_audit }}
        run: npx playwright test e2e/phase-1-accessibility.spec.ts e2e/phase-1-auth.spec.ts e2e/guardian-dashboard.spec.ts e2e/persona-access-isolation.spec.ts e2e/persona-registration.spec.ts e2e/phase-2-partner-onboarding.spec.ts e2e/phase-2-offer-redemption.spec.ts
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-playwright-results
          path: test-results/
          if-no-files-found: ignore
