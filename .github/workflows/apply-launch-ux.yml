name: Apply launch UX polish

on:
  push:
    branches:
      - ux/global-nav-lostpaws-home

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply launch navigation and LostPaws home feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/global-nav-lostpaws-home
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply focused source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main.tsx')
          text = path.read_text()

          new_header = '''function Header() {
            const [o, setO] = useState(false);
            const { session } = useAuth();
            const location = useLocation();
            const navigate = useNavigate();
            useEffect(() => setO(false), [location.pathname, location.search]);
            async function signOut() {
              navigate("/", { replace: true });
              await db?.auth.signOut();
            }
            return (
              <header>
                <div className="shell head">
                  <Link className="brand" to="/">
                    <img src="/brand/shelterpawtners.png" alt="" />
                    ShelterPawtners
                  </Link>
                  <button
                    className="menu"
                    onClick={() => setO(!o)}
                    aria-expanded={o}
                    aria-controls="primary-navigation"
                    aria-label={o ? "Close menu" : "Open menu"}
                  >
                    {o ? <X /> : <Menu />}
                  </button>
                  <nav
                    id="primary-navigation"
                    className={o ? "open" : ""}
                    aria-label="Primary navigation"
                  >
                    <Link to="/marketplace">Marketplace</Link>
                    <Link to="/lostpaws">LostPaws</Link>
                    <Link to="/rave">RAVE Shelter</Link>
                    {!session && <Link to="/register">Join</Link>}
                    {session && <AdminQaNavLink />}
                    {session ? (
                      <>
                        <Link to="/dashboard">My dashboard</Link>
                        <GuardianAccountMenu session={session} />
                        <button className="navSignOut" type="button" onClick={signOut}>
                          Sign out
                        </button>
                      </>
                    ) : (
                      <Link className="btn quiet" to="/login">
                        Sign in
                      </Link>
                    )}
                  </nav>
                </div>
              </header>
            );
          }'''

          text, count = re.subn(
            r'function Header\(\) \{.*?\n\}\nfunction Footer\(\)',
            new_header + '\nfunction Footer()',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('Header boundary did not match; refusing unsafe patch')

          choose_path = '''<section className="section shell">
                <span className="eyebrow">Choose your path</span>'''
          feature = '''<section className="lostPawsFeature">
                <div className="shell lostPawsFeatureCard">
                  <div>
                    <span className="eyebrow">Featured this month · September 2026</span>
                    <h2>LostPaws is launching the RAVE Shelter mission in the music community.</h2>
                    <p className="lead">
                      LostPaws is our first public RAVE Shelter activation: a focused way for ravers
                      to discover useful festival-ready value and for vendors to reach the community
                      while helping bring more attention and support to shelter pets and adoption.
                    </p>
                    <div className="actions">
                      <Link className="btn" to="/lostpaws">
                        Explore LostPaws <ArrowRight />
                      </Link>
                      <Link className="btn quiet" to="/rave">
                        Meet RAVE Shelter
                      </Link>
                    </div>
                    <small>
                      Independent community initiative. No festival affiliation or endorsement is implied.
                    </small>
                  </div>
                  <aside className="lostPawsRoadmap" aria-label="RAVE Shelter roadmap">
                    <Music2 />
                    <span className="eyebrow">What comes next</span>
                    <h3>RAVE Shelter grows beyond this launch.</h3>
                    <p>
                      RAVE Shelter — the Rescue and Adoption Vendor Ecosystem — is being built to
                      connect ravers, vendors, shelters, and pet adoption around useful offers and
                      measurable community value. LostPaws is the first activation; the broader
                      initiative is targeted for rollout at the end of 2026.
                    </p>
                    <Link to="/register?type=rave_vendor">
                      Vendors: join the ecosystem <ArrowRight />
                    </Link>
                  </aside>
                </div>
              </section>
              <section className="section shell">
                <span className="eyebrow">Choose your path</span>'''
          if choose_path not in text:
            raise SystemExit('Home Choose your path insertion point did not match')
          text = text.replace(choose_path, feature, 1)

          new_menu = '''function GuardianAccountMenu({ session }: { session: Session | null }) {
            const [showHelp, setShowHelp] = useState(false);
            const name =
              session?.user.user_metadata.full_name ||
              session?.user.email?.split("@")[0] ||
              "Member";
            const initial = name.trim().charAt(0).toUpperCase() || "S";

            return (
              <details className="guardianAccountMenu">
                <summary aria-label="Open account menu">
                  <span className="guardianAvatar" aria-hidden="true">
                    {initial}
                  </span>
                  <span>Account</span>
                </summary>
                <div className="guardianAccountPanel">
                  <div>
                    <b>{name}</b>
                    <p>ShelterPawtners account</p>
                  </div>
                  <Link to="/dashboard">My dashboard</Link>
                  <button type="button" onClick={() => setShowHelp(true)}>
                    Help &amp; feedback
                  </button>
                  {showHelp && <HelpFeedback session={session} initiallyOpen />}
                </div>
              </details>
            );
          }'''
          text, count = re.subn(
            r'function GuardianAccountMenu\(.*?\n\}\nfunction Dashboard\(\)',
            new_menu + '\nfunction Dashboard()',
            text,
            count=1,
            flags=re.S,
          )
          if count != 1:
            raise SystemExit('Account menu boundary did not match; refusing unsafe patch')

          start = text.find('function Dashboard() {')
          end = text.find('\nfunction GuardianPetDetail()', start)
          if start < 0 or end < 0:
            raise SystemExit('Dashboard boundaries did not match')
          dashboard = text[start:end]

          dashboard, count = re.subn(
            r'\n  async function signOut\(\) \{\n    navigate\("/", \{ replace: true \}\);\n    await db\?\.auth\.signOut\(\);\n  \}',
            '',
            dashboard,
            count=1,
          )
          if count != 1:
            raise SystemExit('Dashboard sign-out block did not match')

          old_actions = '''          {kind === "guardian" ? (
            <div className="dashboardAccountActions">
              <GuardianAccountMenu session={session} onSignOut={signOut} />
              <button className="btn quiet" onClick={signOut}>
                Sign out
              </button>
            </div>
          ) : (
            <button className="btn quiet" onClick={signOut}>
              Sign out
            </button>
          )}
          '''
          if old_actions not in dashboard:
            raise SystemExit('Dashboard account actions did not match')
          dashboard = dashboard.replace(old_actions, '', 1)
          text = text[:start] + dashboard + text[end:]
          path.write_text(text)

          styles = Path('src/styles.css')
          css = styles.read_text()
          marker = '/* launch-nav-lostpaws-home */'
          if marker not in css:
            css += '''

          /* launch-nav-lostpaws-home */
          header .guardianAccountMenu {
            min-width: auto;
          }
          header .guardianAccountMenu summary {
            color: #f5f7ff;
            white-space: nowrap;
          }
          header .guardianAccountPanel {
            color: var(--navy);
          }
          .navSignOut {
            min-height: 40px;
            padding: 9px 13px;
            border: 1px solid #53627c;
            border-radius: 11px;
            background: transparent;
            color: #f5f7ff;
            font-weight: 800;
          }
          .navSignOut:hover {
            border-color: #75e3d4;
            color: #75e3d4;
          }
          .lostPawsFeature {
            padding: 42px 0;
            background:
              radial-gradient(circle at 8% 20%, #8b26c91f, transparent 28%),
              radial-gradient(circle at 92% 75%, #0e9f9a24, transparent 30%),
              #0d172b;
            color: #fff;
          }
          .lostPawsFeatureCard {
            display: grid;
            grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.72fr);
            gap: 34px;
            align-items: stretch;
          }
          .lostPawsFeature h2 {
            max-width: 820px;
            margin: 12px 0;
            font-family: Outfit;
            font-size: clamp(2rem, 4vw, 3.45rem);
            line-height: 1.08;
            letter-spacing: -0.035em;
          }
          .lostPawsFeature .lead {
            color: #c7cedb;
          }
          .lostPawsFeature small {
            color: #a9b2c4;
          }
          .lostPawsRoadmap {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 26px;
            border: 1px solid #42516d;
            border-radius: 22px;
            background: #15223bd9;
            box-shadow: 0 22px 60px #050a143d;
          }
          .lostPawsRoadmap > svg {
            width: 34px;
            height: 34px;
            margin-bottom: 18px;
            color: #75e3d4;
          }
          .lostPawsRoadmap h3 {
            margin: 8px 0;
            font-family: Outfit;
            font-size: 1.55rem;
          }
          .lostPawsRoadmap p {
            color: #c7cedb;
            line-height: 1.65;
          }
          .lostPawsRoadmap a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 8px;
            color: #75e3d4;
            font-weight: 800;
          }
          .lostPawsRoadmap a svg {
            width: 17px;
          }
          @media (max-width: 700px) {
            .lostPawsFeatureCard {
              grid-template-columns: 1fr;
            }
            header .guardianAccountMenu {
              width: 100%;
            }
            header .guardianAccountMenu summary {
              min-height: 44px;
              justify-content: flex-start;
            }
            header .guardianAccountPanel {
              position: static;
              width: 100%;
              margin-top: 8px;
            }
            .navSignOut {
              width: 100%;
              min-height: 44px;
              text-align: left;
            }
          }
          '''
          styles.write_text(css)
          PY

      - name: Format changed source
        run: npx prettier --write src/main.tsx src/styles.css .github/workflows/apply-launch-ux.yml

      - name: Run repository gates
        run: |
          npm run check
          npm run build

      - name: Commit focused launch UX
        shell: bash
        run: |
          git config user.name "ShelterPawtners Automation"
          git config user.email "shelterpawtners@gmail.com"
          git rm .github/workflows/apply-launch-ux.yml .github/launch-ux-trigger.txt
          git add src/main.tsx src/styles.css
          git commit -m "Apply launch navigation and LostPaws home feature"
          git push origin HEAD:ux/global-nav-lostpaws-home
