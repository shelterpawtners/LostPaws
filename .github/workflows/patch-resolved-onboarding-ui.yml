name: Patch Resolved Onboarding UI

on:
  push:
    branches:
      - launch/pre-cutover-readiness
    paths:
      - .github/workflows/patch-resolved-onboarding-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: launch/pre-cutover-readiness
      - name: Patch resolved onboarding handling
        run: node scripts/patch-resolved-onboarding-ui.cjs
      - name: Format source
        run: npx prettier --write src/main.tsx
      - name: Commit source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-resolved-onboarding-ui.yml
          rm scripts/patch-resolved-onboarding-ui.cjs
          git config user.name 'ShelterPawtners automation'
          git config user.email 'shelterpawtners@gmail.com'
          git add src/main.tsx .github/workflows/patch-resolved-onboarding-ui.yml scripts/patch-resolved-onboarding-ui.cjs
          git commit -m 'Recognize resolved Partner onboarding drafts'
          git push origin HEAD:launch/pre-cutover-readiness
