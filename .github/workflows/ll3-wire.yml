name: LL3 Wire Shelter Verification Route

on:
  push:
    branches: [phase3/shelter-verification]
    paths: [.github/workflows/ll3-wire.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase3/shelter-verification
          fetch-depth: 0
      - name: Wire responder route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.tsx')
          text = path.read_text()
          import_needle = 'import { GuardianPetPassport } from "./components/GuardianPetPassport";\n'
          import_replacement = import_needle + 'import { AdoptionVerificationResponder } from "./components/AdoptionVerificationResponder";\n'
          if import_needle not in text:
              raise SystemExit('GuardianPetPassport import anchor not found')
          if 'AdoptionVerificationResponder' not in text:
              text = text.replace(import_needle, import_replacement, 1)
          route_needle = '      <Route path="/reset-password" element={<ResetPassword />} />\n'
          route_replacement = route_needle + '''      <Route\n        path="/verify/adoption/:token"\n        element={\n          <Page>\n            <AdoptionVerificationResponder />\n          </Page>\n        }\n      />\n'''
          if route_needle not in text:
              raise SystemExit('reset-password route anchor not found')
          if 'path="/verify/adoption/:token"' not in text:
              text = text.replace(route_needle, route_replacement, 1)
          path.write_text(text)
          PY
      - name: Commit route wiring and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/ll3-wire.yml
          git add src/main.tsx
          git config user.name "shelterpawtners-automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Wire shelter adoption verification route"
          git push origin HEAD:phase3/shelter-verification
