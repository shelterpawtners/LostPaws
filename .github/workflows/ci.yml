name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.impact.outputs.docs }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
      requires_web_ci: ${{ steps.impact.outputs.requires_web_ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: impact
        name: Classify changed risk
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/classify-change-impact.sh "$BASE_SHA" "$HEAD_SHA"

  docs-format:
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check documentation and Copilot configuration formatting
        run: npx prettier --check docs README.md AGENTS.md CLAUDE.md '.github/**/*.{md,yml,yaml,json}'

  web:
    needs: classify
    if: needs.classify.outputs.requires_web_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:shell
      - run: npm test
      - run: npm run build

  ci-gate:
    name: CI Gate
    if: always()
    needs: [classify, docs-format, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable CI checks
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs-format.result }}
          WEB_REQUIRED: ${{ needs.classify.outputs.requires_web_ci }}
          WEB_RESULT: ${{ needs.web.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY" == "success" ]] || { echo "Change classification failed."; exit 1; }
          if [[ "$DOCS_ONLY" == "true" && "$DOCS_RESULT" != "success" ]]; then
            echo "Documentation formatting check did not pass."
            exit 1
          fi
          if [[ "$WEB_REQUIRED" == "true" && "$WEB_RESULT" != "success" ]]; then
            echo "Web CI did not pass."
            exit 1
          fi
          echo "All applicable CI checks passed."
