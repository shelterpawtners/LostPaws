name: Issue 100 apply unified mission patch

on:
  push:
    branches:
      - ux/issue-100-unified-rave-mission

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/issue-100-unified-rave-mission
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source patch
        run: python scripts/issue100_integrate.py

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Build app
        run: npm run build

      - name: Commit integrated source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git commit -m "Issue #100: wire unified LostPaws and RAVE Shelter flow"
          git push origin HEAD:ux/issue-100-unified-rave-mission
