<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101a31" />
    <meta
      name="description"
      content="ShelterPawtners connects pet care, useful savings, and communities supporting shelter adoption."
    />
    <title>ShelterPawtners</title>

    <!-- Vite rewrites these root-relative paths for the GitHub Pages base. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- Social sharing. This is a single-page app with one static document, so
         these are site-wide defaults rather than per-route cards; per-route
         previews would need server-side rendering or prerendering. The absolute
         URLs use the canonical apex, since most scrapers reject relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShelterPawtners" />
    <meta
      property="og:title"
      content="ShelterPawtners — Care, savings, and community for shelter pets"
    />
    <meta
      property="og:description"
      content="Adopt, verify the adoption, and unlock lifetime savings from participating businesses. Guardian accounts are always free."
    />
    <meta property="og:url" content="https://shelterpawtners.com/" />
    <meta
      property="og:image"
      content="https://shelterpawtners.com/brand/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ShelterPawtners — care, savings, and community for shelter pets"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ShelterPawtners — Care, savings, and community for shelter pets"
    />
    <meta
      name="twitter:description"
      content="Adopt, verify the adoption, and unlock lifetime savings from participating businesses. Guardian accounts are always free."
    />
    <meta
      name="twitter:image"
      content="https://shelterpawtners.com/brand/social-card.png"
    />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
